<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07090d">
<title>Cross-Gen Pokémon – Pokémon Pitch Black 2</title>
<meta name="description" content="Pokémon from later generations that you can find in Pokémon Pitch Black 2: types, abilities, base stats, movesets and TMs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
  :root {
    --ink: #07090d;
    --panel: #10141c;
    --panel-2: #161b26;
    --line: #232b3a;
    --line-2: #34405a;
    --text: #eaf0fb;
    --muted: #8e9ab2;
    --bolt: #2f7bff;
    --volt: #ffcb05;
    --display: "Anybody", "Arial Narrow", system-ui, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--ink); color: var(--text);
    font-family: var(--body); font-size: 16px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font-family: inherit; }
  :focus-visible { outline: 3px solid var(--volt); outline-offset: 2px; }
  .wrap { width: min(1240px, 100% - 32px); margin-inline: auto; }

  /* ───────── hero ───────── */
  .hero-zone { position: relative; isolation: isolate; overflow: hidden; }
  .hero-zone::before {
    content: ""; position: absolute; inset: 0; z-index: -2;
    background:
      radial-gradient(760px 380px at 50% 18%, rgba(47,123,255,.34), transparent 70%),
      radial-gradient(420px 260px at 88% 8%, rgba(255,203,5,.07), transparent 70%);
  }
  .hero-zone::after {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: repeating-linear-gradient(115deg, rgba(255,255,255,.04) 0 2px, transparent 2px 24px);
    -webkit-mask-image: radial-gradient(ellipse 70% 80% at 50% 25%, #000 0%, transparent 75%);
            mask-image: radial-gradient(ellipse 70% 80% at 50% 25%, #000 0%, transparent 75%);
  }
  .topbar { padding-top: 16px; }
  .hero .lead { margin: 12px auto 0; max-width: 560px; color: #b9c4da; font-size: clamp(15px, 2.2vw, 17px); font-weight: 500; }
  .home-link {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 16px 9px 12px; border-radius: 999px;
    background: rgba(16,20,28,.7); border: 1px solid var(--line-2);
    color: var(--text); text-decoration: none; font-size: 14.5px; font-weight: 600;
    backdrop-filter: blur(8px);
    transition: border-color .15s, background .15s;
  }
  .home-link:hover { border-color: var(--volt); background: rgba(22,27,38,.9); }
  .home-link svg { width: 16px; height: 16px; }

  .hero { text-align: center; padding: 6px 0 38px; }
  .hero .logo {
    display: block; margin: 0 auto 8px; width: min(380px, 80vw); height: auto;
    filter: drop-shadow(0 0 26px rgba(47,123,255,.55)) drop-shadow(0 6px 14px rgba(0,0,0,.5));
  }
  h1 {
    margin: 0; font-family: var(--display); font-weight: 800; font-stretch: 125%;
    font-size: clamp(30px, 5.6vw, 54px); line-height: 1.05; letter-spacing: .005em;
    text-shadow: 0 3px 0 rgba(0,0,0,.35), 0 0 40px rgba(47,123,255,.35);
  }

  /* ───────── toolbar ───────── */
  .searchbar {
    position: sticky; top: 0; z-index: 30; padding: 10px 0;
    background: rgba(7,9,13,.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-block: 1px solid var(--line);
  }
  .search-row { display: flex; gap: 10px; align-items: center; }
  .search { position: relative; flex: 1 1 auto; min-width: 0; }
  .filters { display: grid; gap: 10px; padding-top: 16px; }
  .search svg.glass { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search input {
    width: 100%; height: 46px; padding: 0 50px 0 44px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    font-size: 16px; font-weight: 500; -webkit-appearance: none; appearance: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .search input::-webkit-search-cancel-button { display: none; }
  .search input::placeholder { color: #67738c; }
  .search input:focus-visible { outline: none; border-color: var(--bolt); box-shadow: 0 0 0 3px rgba(47,123,255,.35); }
  .search kbd {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    min-width: 24px; padding: 2px 7px; text-align: center; border-radius: 6px;
    border: 1px solid var(--line-2); background: var(--panel-2); color: var(--muted);
    font: 600 12px var(--body); pointer-events: none;
  }
  .search input:focus ~ kbd, .search input:not(:placeholder-shown) ~ kbd { display: none; }
  @media (hover: none) { .search kbd { display: none; } }
  .count { color: var(--muted); font-weight: 600; font-size: 14.5px; font-variant-numeric: tabular-nums; }
  .reset {
    background: transparent; border: 1px solid var(--line-2); color: var(--text);
    padding: 0 14px; height: 46px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; flex: none;
    transition: border-color .15s, background .15s;
  }
  .reset:hover { border-color: var(--volt); background: var(--panel); }
  .reset[hidden] { display: none; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    --tc: #8e9ab2;
    flex: none; display: inline-flex; align-items: center; gap: 7px;
    padding: 4px 11px 4px 5px; border-radius: 999px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    font-size: 14px; font-weight: 600;
    transition: background .15s, border-color .15s;
  }
  .chip img { width: 22px; height: 22px; display: block; }
  .chip .n { color: var(--muted); font-weight: 500; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .chip:hover { border-color: color-mix(in srgb, var(--tc) 65%, var(--line)); }
  .chip[aria-pressed="true"] { background: color-mix(in srgb, var(--tc) 30%, #0b0e14); border-color: var(--tc); }
  .chip[aria-pressed="true"] .n { color: var(--text); }

  /* ───────── cards ───────── */
  main { padding: 22px 0 48px; }
  .grid {
    list-style: none; margin: 0; padding: 0; display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fill, minmax(296px, 1fr));
  }
  .card {
    position: relative; display: flex; flex-direction: column; overflow: hidden;
    background: var(--panel); border-radius: 16px;
    border: 1px solid color-mix(in srgb, var(--c1) 30%, var(--line));
    transition: border-color .2s; scroll-margin-top: 84px;
  }
  .card[hidden] { display: none; }
  .card:hover { border-color: color-mix(in srgb, var(--c1) 80%, #fff 6%); }

  /* the type-split stage: the memorable bit */
  .stage {
    --t1: color-mix(in srgb, var(--c1) 46%, #0a0d13);
    --t2: color-mix(in srgb, var(--c2) 46%, #0a0d13);
    --spot: radial-gradient(130px 96px at 50% 66%, rgba(255,255,255,.2), transparent 72%);
    --fade: linear-gradient(to top, rgba(7,9,13,.74), transparent 54%);
    --split: linear-gradient(112deg, var(--t1) 0 49.3%, rgba(255,255,255,.38) 49.3% 50.2%, var(--t2) 50.2% 100%);
    position: relative; height: 188px;
    background: var(--spot), var(--fade), var(--split);
  }
  .mono .stage { --split: linear-gradient(112deg, var(--t1), color-mix(in srgb, var(--c1) 26%, #0a0d13)); }
  .stage::after { /* ground shadow */
    content: ""; position: absolute; left: 50%; bottom: 48px; width: 104px; height: 15px;
    transform: translateX(-50%); z-index: 0;
    background: radial-gradient(closest-side, rgba(0,0,0,.5), transparent);
  }
  .id {
    position: absolute; top: 11px; left: 14px; z-index: 2;
    font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: .02em;
    color: #fff; text-shadow: 0 1px 10px rgba(0,0,0,.5);
  }
  .sprite {
    position: absolute; z-index: 1; inset: 30px 0 54px;
    display: grid; justify-items: center; align-items: end;
  }
  .sprite img { display: block; }
  .types { position: absolute; z-index: 2; left: 10px; right: 10px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .type {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px 3px 4px; border-radius: 999px;
    background: rgba(7,9,13,.62); border: 1px solid rgba(255,255,255,.2);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    font-size: 13.5px; font-weight: 600;
  }
  .type img { width: 24px; height: 24px; display: block; }

  .body { flex: 1; display: flex; flex-direction: column; gap: 13px; padding: 15px 16px 16px; }
  .name {
    margin: 0; font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1.1;
    letter-spacing: .005em; overflow-wrap: anywhere;
  }
  .abilities { display: flex; flex-wrap: wrap; gap: 6px; }
  .ability {
    display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px 4px 9px; border-radius: 8px;
    background: var(--panel-2); border: 1px solid var(--line); color: #dbe3f4;
    font-size: 13.5px; font-weight: 500; text-decoration: none;
    transition: border-color .15s, background .15s;
  }
  a.ability:hover {
    border-color: color-mix(in srgb, var(--c1) 70%, var(--line));
    background: color-mix(in srgb, var(--c1) 16%, var(--panel-2));
    color: #fff;
  }
  .ability svg { width: 9px; height: 9px; flex: none; color: color-mix(in srgb, var(--c1) 62%, #fff); }

  .stats { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .stat { display: grid; grid-template-columns: 52px 30px 1fr; align-items: center; gap: 8px; font-size: 13px; }
  .stat .k { color: var(--muted); font-weight: 600; }
  .stat .v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat.hi .v { color: var(--volt); }
  .bar { height: 7px; border-radius: 99px; background: #0a0d14; overflow: hidden; }
  .bar > i {
    display: block; height: 100%; border-radius: 99px; width: var(--w);
    background: linear-gradient(90deg, color-mix(in srgb, var(--k) 62%, #000), var(--k));
  }
  .js .bar > i { width: 0; transition: width .75s cubic-bezier(.2,.7,.2,1) var(--d, 0ms); }
  .js .card.in .bar > i { width: var(--w); }

  .total {
    margin-top: auto; padding-top: 11px; border-top: 1px solid var(--line);
    display: flex; align-items: baseline; justify-content: space-between;
    color: var(--muted); font-weight: 600; font-size: 14px;
  }
  .total b { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; color: var(--text); font-variant-numeric: tabular-nums; }


  /* ───────── expandable card ───────── */
  .card.can-open { cursor: pointer; }
  .expander {
    position: absolute; top: 9px; right: 10px; z-index: 3; height: 32px; padding: 0 9px 0 13px;
    display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
    color: var(--text); font-size: 13px; font-weight: 600;
    background: rgba(7,9,13,.62); border: 1px solid rgba(255,255,255,.28); border-radius: 999px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: background .15s, border-color .15s;
  }
  .expander:hover { background: rgba(7,9,13,.84); border-color: var(--volt); }
  .expander svg { width: 16px; height: 16px; transition: transform .25s; }
  .card.open .expander svg { transform: rotate(180deg); }

  .detail { display: none; }
  .card.open {
    grid-column: 1 / -1; cursor: default; display: grid; grid-template-columns: minmax(0, 1fr);
    border-color: color-mix(in srgb, var(--c1) 80%, #fff 6%);
    box-shadow: 0 18px 50px rgba(0,0,0,.45), 0 0 0 1px color-mix(in srgb, var(--c1) 35%, transparent);
  }
  .card.open[hidden] { display: none; }
  .card.open .detail { display: block; }

  .detail {
    padding: 20px 22px 24px; border-top: 1px solid var(--line);
    background: linear-gradient(180deg, color-mix(in srgb, var(--c1) 8%, var(--panel)), var(--panel) 70%);
  }
  .d-sec + .d-sec { margin-top: 24px; }
  .detail h3 {
    margin: 0 0 12px; display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
    font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1.2; letter-spacing: .01em;
  }
  .who {
    padding: 2px 11px; border-radius: 999px; font: 600 13px var(--body); letter-spacing: 0;
    background: color-mix(in srgb, var(--c1) 28%, #0b0e14); border: 1px solid color-mix(in srgb, var(--c1) 60%, transparent);
  }

  .evo { display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
  .evo-branches { display: flex; flex-direction: column; gap: 10px; flex: 1 1 0; min-width: 0; }
  .evo-branch { display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
  .evo-branch + .evo-branch::before { content: "or"; align-self: center; padding: 1px 10px; border-radius: 999px; font: 700 11px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line-2); }
  @media (min-width: 700px) { .evo-branch + .evo-branch::before { display: none; } }
  .evo-node {
    flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 9px; padding: 11px;
    border-radius: 14px; background: color-mix(in srgb, var(--c1) 9%, var(--panel-2));
    border: 1px solid color-mix(in srgb, var(--c1) 28%, var(--line));
    transition: border-color .15s, background .15s;
  }
  .evo-node:hover { border-color: color-mix(in srgb, var(--c1) 65%, var(--line)); }
  .evo-node.active {
    background: color-mix(in srgb, var(--c1) 22%, var(--panel-2));
    border-color: color-mix(in srgb, var(--c1) 85%, #fff 5%);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c1) 50%, transparent);
  }
  .evo-pick {
    display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 11px; align-items: center;
    padding: 0; border: 0; background: none; color: inherit; text-align: left; cursor: pointer;
  }
  .evo-pick:focus-visible { outline-offset: 4px; border-radius: 10px; }
  .thumb {
    width: 64px; height: 64px; display: grid; place-items: center; border-radius: 12px;
    background: radial-gradient(circle at 50% 72%, rgba(255,255,255,.16), transparent 70%), color-mix(in srgb, var(--c1) 28%, #0a0d13);
  }
  .thumb img { display: block; }
  .evo-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .evo-id { font-family: var(--display); font-weight: 800; font-size: 13px; color: var(--muted); }
  .evo-name { font-family: var(--display); font-weight: 800; font-size: 18px; line-height: 1.1; overflow-wrap: anywhere; }
  .evo-types { display: flex; gap: 4px; margin-top: 5px; }
  .evo-types img { width: 20px; height: 20px; display: block; }
  .evo-abil { display: flex; flex-wrap: wrap; gap: 5px; }
  .evo-abil .ability { font-size: 12.5px; padding: 3px 9px 3px 7px; }
  .evo-arrow {
    flex: none; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 10px; padding: 2px 0;
    color: var(--muted); font-size: 12.5px; font-weight: 600; text-align: center;
  }
  .evo-arrow svg { width: 36px; height: 14px; color: var(--volt); transform: rotate(90deg); }
  .evo-arrow .how { max-width: 150px; }
  .evo-arrow .how svg { width: 15px; height: 15px; transform: none; color: currentColor; }

  .moves-wrap {
    position: relative; height: 212px; border-radius: 14px; overflow: hidden;
    background: color-mix(in srgb, var(--c1) 5%, #0b0e14); border: 1px solid var(--line);
  }
  .moves-wrap::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 26px; pointer-events: none;
    background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--c1) 5%, #0b0e14));
  }
  .moves-scroll {
    height: 100%; overflow-y: auto; padding: 10px 10px 26px; overscroll-behavior: contain;
    scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--c1) 55%, #333) transparent;
  }
  .moves-wrap .no-moves { height: 100%; display: grid; place-items: center; }
  .moves {
    list-style: none; margin: 0; padding: 0; display: grid; gap: 6px;
    grid-template-columns: repeat(auto-fill, minmax(212px, 1fr));
  }
  .count { font: 600 13px var(--body); letter-spacing: 0; color: var(--muted); }
  .move {
    display: flex; align-items: center; gap: 10px; padding: 5px 12px 5px 5px; border-radius: 10px;
    color: var(--text); text-decoration: none; font-size: 14.5px; font-weight: 600;
    background: color-mix(in srgb, var(--mc) 15%, var(--panel-2));
    border: 1px solid color-mix(in srgb, var(--mc) 38%, transparent);
    transition: background .15s, border-color .15s, transform .15s;
  }
  .move:hover { background: color-mix(in srgb, var(--mc) 28%, var(--panel-2)); border-color: color-mix(in srgb, var(--mc) 80%, #fff 5%); transform: translateY(-1px); }
  .move:focus-visible { outline: 2px solid var(--volt); outline-offset: 2px; }
  .mname { min-width: 0; overflow-wrap: anywhere; }
  .lv {
    flex: none; min-width: 48px; padding: 3px 7px; border-radius: 7px; text-align: center;
    font-family: var(--display); font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; color: #fff;
    background: color-mix(in srgb, var(--mc) 62%, #0a0d13); border: 1px solid color-mix(in srgb, var(--mc) 70%, transparent);
    text-shadow: 0 1px 1px rgba(0,0,0,.45);
  }
  .lv small { margin-right: 3px; font-family: var(--body); font-weight: 600; font-size: 10.5px; opacity: .8; }
  .no-moves { margin: 0; color: var(--muted); }


  /* ───────── TMs & HMs drawer (inside the open card) ───────── */
  .tm-sec { --tc: var(--c1); }
  .tm-h { margin: 0; }
  .tm-toggle {
    width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 14px;
    padding: 12px 16px 12px 12px; border-radius: 14px; cursor: pointer; text-align: left; color: var(--text);
    background:
      radial-gradient(120% 140% at 0% 50%, color-mix(in srgb, var(--tc) 26%, transparent), transparent 60%),
      linear-gradient(90deg, color-mix(in srgb, var(--tc) 10%, var(--panel-2)), var(--panel-2));
    border: 1px solid color-mix(in srgb, var(--tc) 38%, var(--line));
    transition: border-color .2s, box-shadow .2s, border-radius .3s;
  }
  .tm-toggle:hover { border-color: color-mix(in srgb, var(--tc) 80%, #fff 6%); box-shadow: 0 6px 22px rgba(0,0,0,.35); }
  .tm-sec.open .tm-toggle { border-radius: 14px 14px 0 0; border-bottom-color: transparent; }
  .tm-disc {
    width: 46px; height: 46px; flex: none; display: grid; place-items: center; border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, rgba(255,255,255,.22), transparent 62%), color-mix(in srgb, var(--tc) 34%, #0a0d13);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--tc) 60%, transparent), 0 4px 16px color-mix(in srgb, var(--tc) 40%, transparent);
  }
  .tm-disc img { width: 30px; height: 30px; display: block; image-rendering: pixelated; transition: transform .45s cubic-bezier(.2,.7,.2,1); }
  .tm-sec.open .tm-disc img { transform: translateY(-3px); }
  .tm-title { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-width: 0; }
  .tm-title b { font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: .01em; line-height: 1.15; }
  .tm-sub { flex-basis: 100%; color: var(--muted); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tm-new-n {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; white-space: nowrap;
    font-size: 12.5px; font-weight: 700; color: #0b0e14; background: var(--volt);
    box-shadow: 0 0 16px rgba(255,203,5,.35);
  }
  .tm-new-n[hidden] { display: none; }
  .tm-chev {
    width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%;
    background: rgba(7,9,13,.5); border: 1px solid rgba(255,255,255,.18);
  }
  .tm-chev svg { width: 17px; height: 17px; transition: transform .3s; }
  .tm-sec.open .tm-chev svg { transform: rotate(180deg); }

  .tm-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .38s cubic-bezier(.2,.7,.2,1); }
  .tm-sec.open .tm-panel { grid-template-rows: 1fr; }
  .tm-inner {
    min-height: 0; overflow: hidden; border-radius: 0 0 14px 14px;
    background: color-mix(in srgb, var(--tc) 5%, #0b0e14);
    border: 1px solid transparent; border-top: 0;
    transition: border-color .38s;
  }
  .tm-sec.open .tm-inner { border-color: color-mix(in srgb, var(--tc) 38%, var(--line)); }

  .tm-filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 12px 4px; }
  .tm-filter {
    display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px 0 10px; border-radius: 999px;
    cursor: pointer; color: var(--text); font-size: 13px; font-weight: 600;
    background: var(--panel-2); border: 1px solid var(--line);
    transition: background .15s, border-color .15s, color .15s;
  }
  .tm-filter:hover { border-color: color-mix(in srgb, var(--tc) 65%, var(--line)); }

function spriteFail(img) {
  const fb = img.dataset.fb;
  if (fb) { img.dataset.fb = ""; img.src = fb; return; }
  img.onerror = null; img.src = PLACEHOLDER;
}
// Showdown ids: "Kommo-o" -> kommoo, "Basculegion (Female)" -> basculegion-f
const FORME_IDS = { female: "f", male: "" };
function spriteName(name) {
  const m = String(name).match(/^(.*?)\s*\((.*)\)$/);
  const base = String(m ? m[1] : name || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  if (!m) return base;
  const f = m[2].toLowerCase();
  const id = f in FORME_IDS ? FORME_IDS[f] : f.replace(/[^a-z0-9]/g, "");
  return id ? base + "-" + id : base;
}

// Every sprite is scaled so its longest side equals the same box: all Pokémon show at one size.
const SPRITE_BOX = 104;
function fitSprite(img) {
  const w = img.naturalWidth, h = img.naturalHeight;
  if (!w || !h) return;
  const k = (+img.dataset.box || SPRITE_BOX) / Math.max(w, h);
  img.style.width = Math.round(w * k) + "px";
  img.style.height = Math.round(h * k) + "px";
  img.style.imageRendering = k > 1 ? "pixelated" : "auto";
}

function statColor(v) {

  return "#6b7a9c";
}

// Item icons come from Showdown; ITEM_FILES fixes the few whose file name differs from the item name.
const ITEM_FILES = { "Deep Sea Scale": "deepseascale", "Deep Sea Tooth": "deepseatooth", "Never-Melt Ice": "nevermeltice" };
const ITEM_ICON = (n, file) => "https://play.pokemonshowdown.com/sprites/itemicons/" +
  (file || ITEM_FILES[n] || String(n).toLowerCase().replace(/['’.]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "")) + ".png";
const LEVEL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
function parseMethod(text) {
  const t = String(text || "").trim();
  let m;
  if ((m = t.match(/holding (?:an? )?(.+?)(?:\s*\((?:male|female)\))?\.?$/i))) return { kind: "hold", item: m[1] };
  if ((m = t.match(/^Use (?:an? )?(.+?)\.?$/i))) return { kind: "item", item: m[1] };
  if (/^Level \d+/i.test(t)) return { kind: "level" };
  return { kind: "other" };
}
const SUN_ICON = '<svg class="t-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-label="Day"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON_ICON = '<svg class="t-ico" viewBox="0 0 24 24" fill="currentColor" aria-label="Night"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
function methodPill(text, itemFile) {
  const m = parseMethod(text);
  const time = /at night/i.test(text) ? MOON_ICON : /during the day|\bday\b/i.test(text) ? SUN_ICON : "";
  const icon = m.item ? '<img src="' + esc(ITEM_ICON(m.item, itemFile)) + '" alt="" width="24" height="24" loading="lazy" onerror="this.remove()">' : (m.kind === "level" ? LEVEL_ICON : "");
  return '<span class="how ' + m.kind + (time ? (/at night/i.test(text) ? " night" : " day") : "") + '">' + icon + "<span>" + esc(text) + "</span>" + time + "</span>";
}

function colorsOf(types) {
  const c1 = TYPE_COLORS[types[0]] || "#6b7a9c";
  const c2 = types[1] ? (TYPE_COLORS[types[1]] || c1) : c1;
  return [c1, c2];
}

// pre-evolutions first, the Pokémon itself last
function chainOf(p) {
  const pre = (p.preevo || []).map((e) => ({
    name: e.name, id: e.pokedex_id, sprite: e.sprite, types: [e.type1, e.type2].filter(Boolean),
    abilities: e.abilities || [], moves: e.moves || [], evo: e.evo || ""
  }));
  const self = [{
    name: p.name, id: p.pokedex_id, sprite: p.sprite, types: [p.type1, p.type2].filter(Boolean),
    abilities: p.abilities, moves: p.moves || [], evo: p.evo || "", self: true
  }];
  // optional "next": the Pokémon it now evolves into (shown after it, same box)
  // "next" may be one object or an array of the following stages (each with its own "evo")
  const next = (Array.isArray(p.next) ? p.next : p.next ? [p.next] : []).map((n) => ({
    name: n.name, id: n.pokedex_id, sprite: n.sprite, types: [n.type1, n.type2].filter(Boolean),
    abilities: n.abilities || [], moves: n.moves || [], evo: n.evo || ""
  }));
  // optional "branches": alternative evolutions of this Pokémon (e.g. Charcadet -> Armarouge / Ceruledge)
  const branches = (p.branches || []).map((n) => ({
    name: n.name, id: n.pokedex_id, sprite: n.sprite, types: [n.type1, n.type2].filter(Boolean),
    abilities: n.abilities || [], moves: n.moves || [], evo: n.evo || "", branch: true
  }));
  return pre.concat(self, next, branches);
}

function moveURL(name) {
  return "https://bulbapedia.bulbagarden.net/wiki/" + encodeURIComponent(name.trim().replace(/\s+/g, "_")) + "_(move)";

function moveLink(m) {
  const t = MOVE_TYPES[m.move] || "", c = TYPE_COLORS[t] || "#6b7a9c";
  return '<a class="move" style="--mc:' + c + '" href="' + moveURL(m.move) + '" target="_blank" rel="noopener noreferrer" title="' +
    esc(m.move) + (t ? " · " + esc(t) : "") + ' on Bulbapedia"><span class="lv"><small>Lv</small>' + esc(m.level) + "</span><span class=\"mname\">" + esc(m.move) + "</span></a>";
}

function movesHTML(list) {
  if (!list || !list.length) return '<p class="no-moves">No level-up moves listed.</p>';
  const sorted = list.map((m, i) => ({ m, i })).sort((a, b) => a.m.level - b.m.level || a.i - b.i);
  return '<div class="moves-scroll" tabindex="0" role="region" aria-label="Level-up moves"><ul class="moves">' + sorted.map(({ m }) =>
    '<li>' + moveLink(m) + "</li>").join("") + "</ul></div>";
}

  Physical: '<svg class="cat phys" viewBox="0 0 24 24" aria-label="Physical" role="img"><title>Physical</title><path fill="currentColor" d="M12 1.8l2.3 5.6 5.9-1.6-2.8 5.3 5 3.4-6 .9.5 6-4.9-3.6L7.1 20.4l.5-6-6-.9 5-3.4L3.8 4.8l5.9 1.6z"/></svg>',
  Special: '<svg class="cat spec" viewBox="0 0 24 24" aria-label="Special" role="img"><title>Special</title><g fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="12" r="5.2"/></g><circle cx="12" cy="12" r="1.9" fill="currentColor"/></svg>',
  Status: '<svg class="cat stat" viewBox="0 0 24 24" aria-label="Status" role="img"><title>Status</title><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 7v5.5l3.5 2"/></g></svg>'
};
const STAR = '<svg class="star" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>';
const TM_FILTERS = [["all", "All"], ["Physical", "Physical"], ["Special", "Special"], ["Status", "Status"], ["hm", "HM"], ["new", "New"]];

function tmEntry(name) {
  if (!TMDATA || !TMDATA.pokemon) return null;
  const e = TMDATA.pokemon[name];
  if (!e) return null;
  const isNew = new Set(e.new || []);
  return e.tm.filter((id) => TMDATA.list[id]).map((id) => Object.assign({ id, hm: id.startsWith("HM"), isNew: isNew.has(id) }, TMDATA.list[id]));
}

function tmMatches(t, f) {
  return f === "all" || (f === "hm" ? t.hm : f === "new" ? t.isNew : t.cat === f);
}

function tmItemsHTML(list, filter) {
  if (!list.length) return '<p class="tm-empty">This Pokémon can\'t learn any TM or HM.</p>';
  return '<ul class="tms">' + list.map((t, i) => {
    const c = TYPE_COLORS[t.type] || "#6b7a9c", num = t.id.slice(2);
    return '<li data-cat="' + t.cat + '"' + (t.hm ? ' data-hm="1"' : "") + (t.isNew ? ' data-new="1"' : "") +
      (tmMatches(t, filter) ? "" : " hidden") + ' style="--i:' + i + '">' +
      '<a class="tm' + (t.hm ? " hm" : "") + '" style="--mc:' + c + '" href="' + moveURL(t.move) + '" target="_blank" rel="noopener noreferrer" ' +
        'title="' + esc(t.id + " " + t.move + " · " + t.type + " · " + t.cat + (t.isNew ? " · new in Pitch Black 2" : "")) + '">' +
        '<span class="tm-no"><img src="' + TM_ICON(t.type) + '" alt="" width="30" height="30" loading="lazy" onerror="this.onerror=null;this.src=TM_FALLBACK"><small>' + (t.hm ? "HM" : "TM") + "</small>" + num + "</span>" +
        '<span class="mname">' + esc(t.move) + "</span>" +
        (t.isNew ? '<span class="new" aria-label="New"></span>' : "") + (CAT_ICONS[t.cat] || "") +
      "</a></li>";
  }).join("") + "</ul>";
}

function tmSectionHTML(node, key, open) {
  const list = tmEntry(node.name);
  if (!list) return "";
  const nTM = list.filter((t) => !t.hm).length, nHM = list.length - nTM, nNew = list.filter((t) => t.isNew).length;
  const c1 = colorsOf(node.types)[0];
  const counts = { all: list.length, hm: nHM, new: nNew };
  ["Physical", "Special", "Status"].forEach((k) => { counts[k] = list.filter((t) => t.cat === k).length; });
  const filters = TM_FILTERS.filter(([k]) => k === "all" || counts[k]).map(([k, label]) =>
    '<button class="tm-filter' + (k === "new" ? " new-f" : "") + '" type="button" data-f="' + k + '" aria-pressed="' + (k === "all") + '">' +
      (CAT_ICONS[k] || (k === "new" ? STAR : "")) + label + ' <span class="n">' + counts[k] + "</span></button>").join("");
  return '<section class="d-sec tm-sec' + (open ? " open" : "") + '" style="--tc:' + c1 + '">' +
    '<h3 class="tm-h"><button class="tm-toggle" type="button" aria-expanded="' + !!open + '" aria-controls="tm-' + key + '">' +
      '<span class="tm-disc" aria-hidden="true"><img src="' + TM_ICON(node.types[0]) + '" alt="" width="30" height="30" onerror="this.onerror=null;this.src=TM_FALLBACK"></span>' +
      '<span class="tm-title"><b>TMs &amp; HMs</b><span class="who">' + esc(node.name) + "</span>" +
        '<span class="tm-sub">' + nTM + " TM" + (nTM === 1 ? "" : "s") + (nHM ? " · " + nHM + " HM" + (nHM === 1 ? "" : "s") : "") + "</span></span>" +
      '<span class="tm-new-n"' + (nNew ? "" : " hidden") + ">" + nNew + " new</span>" +
      '<span class="tm-chev" aria-hidden="true">' + CHEVRON + "</span>" +
    "</button></h3>" +
    '<div class="tm-panel" id="tm-' + key + '"><div class="tm-inner">' +
      '<div class="tm-filters" role="group" aria-label="Filter TMs">' + filters + "</div>" +
      '<div class="tm-scroll" tabindex="0" role="region" aria-label="TMs and HMs">' + tmItemsHTML(list, "all") + "</div>" +
      (nNew ? '<div class="tm-legend"><span><i class="new"></i>New in Pitch Black 2</span></div>' : "") +
    "</div></div></section>";
}

function toggleTM(sec) {
  const open = !sec.classList.contains("open");
  sec.classList.toggle("open", open);
  sec.querySelector(".tm-toggle").setAttribute("aria-expanded", open ? "true" : "false");
}

function filterTM(sec, btn) {
  const f = btn.dataset.f;
  sec.querySelectorAll(".tm-filter").forEach((b) => b.setAttribute("aria-pressed", b === btn ? "true" : "false"));
  sec.querySelectorAll(".tms li").forEach((li) => {
    const ok = f === "all" || (f === "hm" ? li.dataset.hm : f === "new" ? li.dataset.new : li.dataset.cat === f);
    li.hidden = !ok;
  });
}

function evoNodeHTML(n, k, active) {
  const [c1, c2] = colorsOf(n.types);
  return '<div class="evo-node' + (active ? " active" : "") + '" data-k="' + k + '" style="--c1:' + c1 + ";--c2:" + c2 + '">' +
    '<button class="evo-pick" type="button" aria-pressed="' + (active ? "true" : "false") + '">' +
      '<span class="thumb"><img data-box="64" src="' + esc(spriteURL(n.name)) + '" data-fb="' + esc(n.sprite || "") + '" alt="" ' +
        'loading="lazy" onload="fitSprite(this)" onerror="spriteFail(this)"></span>' +
      '<span class="evo-info"><span class="evo-id">#' + String(n.id).padStart(3, "0") + '</span><span class="evo-name">' + esc(n.name) + "</span>" +
        '<span class="evo-types">' + n.types.map((t) =>
          '<img src="' + (TYPE_ICONS[t] || "") + '" alt="' + esc(t) + ' type" title="' + esc(t) + '" width="20" height="20" loading="lazy">').join("") + "</span></span>" +
    "</button>" +
    '<div class="evo-abil">' + n.abilities.map((a) => abilityLink(a)).join("") + "</div>" +
  "</div>";
}

function detailHTML(p, key) {
  const chain = chainOf(p), last = chain.length - 1, me = chain.findIndex((n) => n.self);
  let evo = "";
  if (chain.length > 1) {
    evo = '<section class="d-sec"><h3>Evolution line</h3><div class="evo">';
    const line = chain.filter((n) => !n.branch), lastLine = line.length - 1;
    line.forEach((n, k) => {
      evo += evoNodeHTML(n, k, k === me);
      if (k < lastLine) evo += '<div class="evo-arrow">' + ARROW + methodPill(n.evo || "Evolves") + "</div>";
    });
    const br = chain.filter((n) => n.branch);
    if (br.length) {
      evo += '<div class="evo-branches">' + br.map((n) => {
        const k = chain.indexOf(n);
        return '<div class="evo-branch"><div class="evo-arrow">' + ARROW + methodPill(n.evo || "Evolves") + "</div>" + evoNodeHTML(n, k, k === me) + "</div>";
      }).join("") + "</div>";
    }
    evo += "</div></section>";
  }
  const [c1] = colorsOf(chain[me].types);
  return '<div class="detail" id="detail-' + key + '">' + evo +
    '<section class="d-sec"><h3>Level-up moves<span class="who">' + esc(chain[me].name) + '</span><span class="count">' + chain[me].moves.length + " moves</span></h3>" +
    '<div class="moves-wrap" style="--c1:' + c1 + '">' + movesHTML(chain[me].moves) + "</div></section>" +
    tmSectionHTML(chain[me], key, false) + "</div>";
}

function cardHTML(p, i) {
  const types = [p.type1, p.type2].filter(Boolean);
  const [c1, c2] = colorsOf(types);
  const stats = STATS.map(([k, label], n) => {
    const v = p.stats[k];
    const w = Math.max(4, Math.min(100, (v / 200) * 100));
    return '<li class="stat' + (v >= 110 ? " hi" : "") + '"><span class="k">' + label + '</span><span class="v">' + v +
      '</span><span class="bar" aria-hidden="true"><i style="--w:' + w + "%;--k:" + statColor(v) + ";--d:" + n * 45 + 'ms"></i></span></li>';
  }).join("");
  const abilities = p.abilities.map((a) => abilityLink(a)).join("");
  const id = String(p.pokedex_id).padStart(3, "0");
  const more = (p.preevo && p.preevo.length) || p.next || p.branches || (p.moves && p.moves.length);
  const toggle = more
    ? '<button class="expander" type="button" aria-expanded="false" aria-controls="detail-' + i + '">Evolution &amp; moves' + CHEVRON + "</button>"
    : "";
  return '<li class="card' + (types.length < 2 ? " mono" : "") + (more ? " can-open" : "") + '" data-i="' + i + '" style="--c1:' + c1 + ";--c2:" + c2 + '">' +
    '<div class="stage">' +
      '<span class="id">#' + id + "</span>" +
      '<div class="sprite"><img src="' + esc(spriteURL(p.name)) + '" data-fb="' + esc(p.sprite || "") + '" ' +
        'alt="' + esc(p.name) + ' sprite" loading="lazy" onload="fitSprite(this)" onerror="spriteFail(this)"></div>' +
      '<div class="types">' + types.map(typeBadge).join("") + "</div>" + toggle +
    "</div>" +
    '<div class="body">' +
      '<h2 class="name">' + esc(p.name) + "</h2>" +
      '<div class="abilities" role="group" aria-label="Abilities">' + abilities + "</div>" +
      '<ul class="stats" aria-label="Base stats">' + stats + "</ul>" +
      '<div class="total"><span>Total</span><b>' + p.bst + "</b></div>" +
    "</div>" +
    (more ? detailHTML(p, i) : "") +
  "</li>";
}

function init(POKEMON) {
// stable sort by Pokédex ID
const DATA = POKEMON.map((p, i) => ({ p, i }))
  .sort((a, b) => a.p.pokedex_id - b.p.pokedex_id || a.i - b.i)
  .map((x) => x.p);

const grid = document.getElementById("grid");
const empty = document.getElementById("empty");
const countEl = document.getElementById("count");
const q = document.getElementById("q");
const chipsEl = document.getElementById("chips");
const resetBtns = [document.getElementById("reset"), document.getElementById("reset2")];
const toTop = document.getElementById("toTop");
const selected = new Set();
let openCard = null;

// type chips (only types present in the data), standard order, with counts
const ORDER = Object.keys(TYPE_ICONS);
const typeCount = {};
DATA.forEach((p) => [p.type1, p.type2].forEach((t) => { if (t) typeCount[t] = (typeCount[t] || 0) + 1; }));
ORDER.filter((t) => typeCount[t]).forEach((t) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.dataset.t = t; b.setAttribute("aria-pressed", "false");
  b.style.setProperty("--tc", TYPE_COLORS[t] || "#8e9ab2");
  b.innerHTML = '<img src="' + TYPE_ICONS[t] + '" alt="" width="22" height="22">' + esc(t) + ' <span class="n">' + typeCount[t] + "</span>";
  b.addEventListener("click", () => {
    if (selected.has(t)) selected.delete(t); else selected.add(t);
    b.setAttribute("aria-pressed", selected.has(t) ? "true" : "false");
    apply();
  });
  chipsEl.appendChild(b);
});

// render all cards once, then just show/hide
grid.innerHTML = DATA.map(cardHTML).join("");
const cards = Array.from(grid.children);

// stat bars fill once, when a card first scrolls into view
const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
if ("IntersectionObserver" in window && !reduce) {
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
  }, { threshold: 0.2 });
  cards.forEach((c) => io.observe(c));
} else {
  cards.forEach((c) => c.classList.add("in"));
}

function apply() {
  const term = q.value.trim().toLowerCase().replace(/^#/, "");
  let shown = 0;
  DATA.forEach((p, i) => {
    const types = [p.type1, p.type2];
    const okType = [...selected].every((t) => types.includes(t));
    const extra = [...(p.preevo || []).map((e) => e.name + " " + (e.evo || "")), ...(Array.isArray(p.next) ? p.next : p.next ? [p.next] : []).map((n) => n.name), ...(p.branches || []).map((n) => n.name), p.evo || "", ...(p.moves || []).map((m) => m.move)].join(" ");
    const hay = (p.name + " " + p.abilities.join(" ") + " " + extra + " " + p.pokedex_id + " " + String(p.pokedex_id).padStart(3, "0")).toLowerCase();
    const ok = okType && (!term || hay.includes(term));
    cards[i].hidden = !ok;
    if (ok) shown++;
  });
  countEl.textContent = shown === DATA.length ? DATA.length + " Pokémon" : shown + " of " + DATA.length + " Pokémon";
  const evoShown = window.evoFilter ? window.evoFilter(term, [...selected]) : 0;
  grid.hidden = shown === 0;
  empty.hidden = shown !== 0 || evoShown !== 0;
  resetBtns[0].hidden = !(selected.size || term);
  if (openCard) { if (openCard.hidden) closeCard(openCard); else placeOpen(openCard); }
}

function clearAll() {
  q.value = ""; selected.clear();
  chipsEl.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", "false"));
  apply(); q.focus();
}

q.addEventListener("input", apply);
resetBtns.forEach((b) => b.addEventListener("click", clearAll));

// "/" jumps to search
document.addEventListener("keydown", (e) => {
  if (e.key !== "/" || e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  e.preventDefault(); q.focus();
});

window.addEventListener("scroll", () => toTop.classList.toggle("show", window.scrollY > 900), { passive: true });
toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" }));

// ───────── expandable cards ─────────
// The open card takes the whole row. It moves to the start of its row so the grid never has gaps
// and every other card keeps its Pokédex order.
function homeSlot(card) { grid.insertBefore(card, cards[+card.dataset.i + 1] || null); }

function placeOpen(card) {
  homeSlot(card);
  card.classList.remove("open");
  const top = card.offsetTop;
  let first = card;
  for (let el = card.previousElementSibling; el; el = el.previousElementSibling) {
    if (el.hidden) continue;
    if (Math.abs(el.offsetTop - top) < 2) first = el; else break;
  }
  card.classList.add("open");
  if (first !== card) grid.insertBefore(card, first);
}

function closeCard(card) {
  card.classList.remove("open");
  homeSlot(card);
  const b = card.querySelector(".expander");
  if (b) b.setAttribute("aria-expanded", "false");
  if (openCard === card) openCard = null;
}

function openCardEl(card) {
  if (openCard && openCard !== card) closeCard(openCard);
  openCard = card;
  card.classList.add("in");
  placeOpen(card);
  const b = card.querySelector(".expander");
  if (b) { b.setAttribute("aria-expanded", "true"); b.focus({ preventScroll: true }); }
  requestAnimationFrame(() => card.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" }));
}

function toggleCard(card) {
  if (card.classList.contains("open")) {
    closeCard(card);
    const b = card.querySelector(".expander");
    if (b) b.focus({ preventScroll: true });
    card.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "nearest" });
  } else {
    openCardEl(card);
  }
}

function pickStage(card, node) {
  const chain = chainOf(DATA[+card.dataset.i]);
  const k = +node.dataset.k;
  card.querySelectorAll(".evo-node").forEach((n) => {
    const on = n === node;
    n.classList.toggle("active", on);
    n.querySelector(".evo-pick").setAttribute("aria-pressed", on ? "true" : "false");
  });
  const wrap = card.querySelector(".moves-wrap");
  wrap.style.setProperty("--c1", colorsOf(chain[k].types)[0]);
  wrap.innerHTML = movesHTML(chain[k].moves);
  card.querySelector(".who").textContent = chain[k].name;
  card.querySelector(".count").textContent = chain[k].moves.length + " moves";
  const oldTM = card.querySelector(".tm-sec");
  if (oldTM) {
    const wasOpen = oldTM.classList.contains("open");
    const tmp = document.createElement("div");
    tmp.innerHTML = tmSectionHTML(chain[k], card.dataset.i, wasOpen);
    if (tmp.firstElementChild) oldTM.replaceWith(tmp.firstElementChild); else oldTM.remove();
  }
}

grid.addEventListener("click", (e) => {
  const card = e.target.closest(".card");
  if (!card || !card.classList.contains("can-open")) return;
  if (e.target.closest("a")) return;
  const pick = e.target.closest(".evo-pick");
  if (pick) { pickStage(card, pick.closest(".evo-node")); return; }
  const tmT = e.target.closest(".tm-toggle");
  if (tmT) { toggleTM(tmT.closest(".tm-sec")); return; }
  const tmF = e.target.closest(".tm-filter");
  if (tmF) { filterTM(tmF.closest(".tm-sec"), tmF); return; }
  if (e.target.closest(".detail")) return;
  toggleCard(card);
});

document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || !openCard) return;
  const card = openCard;
  closeCard(card);
  const b = card.querySelector(".expander");
  if (b) b.focus({ preventScroll: true });
});

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (openCard) placeOpen(openCard); }, 120);
});

if (DATA.some((p) => p.moves && p.moves.length)) q.placeholder = "Search by name, ability, move or #ID";

window.applyChanges = apply;
apply();
}

// ───────── load the JSON ─────────
const statusEl = document.getElementById("count");
statusEl.textContent = "Loading Pokémon…";
async function loadTMs() {
  for (const url of TM_URLS) {
    try {
      const res = await fetch(url, { cache: "no-cache" });
      if (!res.ok) continue;
      TMDATA = await res.json();
      return;
    } catch (err) { /* try the next URL */ }
  }
}
(async function load() {
  await loadTMs();
  let lastErr;
  for (const url of DATA_URLS) {
    try {
      const res = await fetch(url, { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status + " on " + url);
      const json = await res.json();
      const list = Array.isArray(json) ? json : (json.pokemon || []);
      init(list);
      return;
    } catch (err) { lastErr = err; }
  }
  statusEl.textContent = "";
  const box = document.getElementById("loadError");
  box.hidden = false;
  box.innerHTML = "<strong>Could not load the Pokémon data.</strong> Check that assets/data/new_pokemon.json exists and is valid JSON." +
    "<code>" + esc(lastErr ? lastErr.message : "unknown error") + "</code>";
})();

</script>
</body>
</html>
