<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07090d">
<title>Pokédex – Pokémon Pitch Black 2</title>
<meta name="description" content="The Pokédex of Pokémon Pitch Black 2: one box per final evolution, with types, abilities, base stats, type matchups, where to find it, evolutions, level-up moves, TMs and tutors for every stage.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
  :root {
    --ink: #07090d;
    --panel: #10141c;
    --panel-2: #161b26;
    --line: #232b3a;
    --line-2: #34405a;
    --text: #eaf0fb;
    --muted: #8e9ab2;
    --bolt: #2f7bff;
    --volt: #ffcb05;
    --display: "Anybody", "Arial Narrow", system-ui, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--ink); color: var(--text);
    font-family: var(--body); font-size: 16px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font-family: inherit; }
  :focus-visible { outline: 3px solid var(--volt); outline-offset: 2px; }
  .wrap { width: min(1240px, 100% - 32px); margin-inline: auto; }

  /* ───────── hero ───────── */
  .hero-zone { position: relative; isolation: isolate; overflow: hidden; }
  .hero-zone::before {
    content: ""; position: absolute; inset: 0; z-index: -2;
    background:
      radial-gradient(760px 380px at 50% 18%, rgba(47,123,255,.34), transparent 70%),
      radial-gradient(420px 260px at 88% 8%, rgba(255,203,5,.07), transparent 70%);
  }
  .hero-zone::after {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: repeating-linear-gradient(115deg, rgba(255,255,255,.04) 0 2px, transparent 2px 24px);
    -webkit-mask-image: radial-gradient(ellipse 70% 80% at 50% 25%, #000 0%, transparent 75%);
            mask-image: radial-gradient(ellipse 70% 80% at 50% 25%, #000 0%, transparent 75%);
  }
  .topbar { padding-top: 16px; }
  .home-link {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 16px 9px 12px; border-radius: 999px;
    background: rgba(16,20,28,.7); border: 1px solid var(--line-2);
    color: var(--text); text-decoration: none; font-size: 14.5px; font-weight: 600;
    backdrop-filter: blur(8px);
    transition: border-color .15s, background .15s;
  }
  .home-link:hover { border-color: var(--volt); background: rgba(22,27,38,.9); }
  .home-link svg { width: 16px; height: 16px; }

  .hero { text-align: center; padding: 6px 0 38px; }
  .hero .logo {
    display: block; margin: 0 auto 8px; width: min(380px, 80vw); height: auto;
    filter: drop-shadow(0 0 26px rgba(47,123,255,.55)) drop-shadow(0 6px 14px rgba(0,0,0,.5));
  }
  h1 {
    margin: 0; font-family: var(--display); font-weight: 800; font-stretch: 125%;
    font-size: clamp(30px, 5.6vw, 54px); line-height: 1.05; letter-spacing: .005em;
    text-shadow: 0 3px 0 rgba(0,0,0,.35), 0 0 40px rgba(47,123,255,.35);
  }

  /* ───────── toolbar ───────── */
  .searchbar {
    position: sticky; top: 0; z-index: 30; padding: 10px 0;
    background: rgba(7,9,13,.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-block: 1px solid var(--line);
  }
  .search-row { display: flex; gap: 10px; align-items: center; }
  .search { position: relative; flex: 1 1 auto; min-width: 0; }
  .filters { display: grid; gap: 10px; padding-top: 16px; }
  .search svg.glass { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search input {
    width: 100%; height: 46px; padding: 0 50px 0 44px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    font-size: 16px; font-weight: 500; -webkit-appearance: none; appearance: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .search input::-webkit-search-cancel-button { display: none; }
  .search input::placeholder { color: #67738c; }
  .search input:focus-visible { outline: none; border-color: var(--bolt); box-shadow: 0 0 0 3px rgba(47,123,255,.35); }
  .search kbd {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    min-width: 24px; padding: 2px 7px; text-align: center; border-radius: 6px;
    border: 1px solid var(--line-2); background: var(--panel-2); color: var(--muted);
    font: 600 12px var(--body); pointer-events: none;
  }
  .search input:focus ~ kbd, .search input:not(:placeholder-shown) ~ kbd { display: none; }
  @media (hover: none) { .search kbd { display: none; } }
  .count { color: var(--muted); font-weight: 600; font-size: 14.5px; font-variant-numeric: tabular-nums; }
  .reset {
    background: transparent; border: 1px solid var(--line-2); color: var(--text);
    padding: 0 14px; height: 46px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; flex: none;
    transition: border-color .15s, background .15s;
  }
  .reset:hover { border-color: var(--volt); background: var(--panel); }
  .reset[hidden] { display: none; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    --tc: #8e9ab2;
    flex: none; display: inline-flex; align-items: center; gap: 7px;
    padding: 4px 11px 4px 5px; border-radius: 999px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    font-size: 14px; font-weight: 600;
    transition: background .15s, border-color .15s;
  }
  .chip img { width: 22px; height: 22px; display: block; }
  .chip .n { color: var(--muted); font-weight: 500; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .chip:hover { border-color: color-mix(in srgb, var(--tc) 65%, var(--line)); }
  .chip[aria-pressed="true"] { background: color-mix(in srgb, var(--tc) 30%, #0b0e14); border-color: var(--tc); }
  .chip[aria-pressed="true"] .n { color: var(--text); }

  /* ───────── cards ───────── */
  main { padding: 22px 0 48px; }
  .grid {
    list-style: none; margin: 0; padding: 0; display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fill, minmax(296px, 1fr));
  }
  .card {
    position: relative; display: flex; flex-direction: column; overflow: hidden;
    background: var(--panel); border-radius: 16px;
    border: 1px solid color-mix(in srgb, var(--c1) 30%, var(--line));
    transition: border-color .2s; scroll-margin-top: 84px;
  }
  .card[hidden] { display: none; }
  .card:hover { border-color: color-mix(in srgb, var(--c1) 80%, #fff 6%); }

  /* the type-split stage: the memorable bit */
  .stage {
    --t1: color-mix(in srgb, var(--c1) 46%, #0a0d13);
    --t2: color-mix(in srgb, var(--c2) 46%, #0a0d13);
    --spot: radial-gradient(130px 96px at 50% 66%, rgba(255,255,255,.2), transparent 72%);
    --fade: linear-gradient(to top, rgba(7,9,13,.74), transparent 54%);
    --split: linear-gradient(112deg, var(--t1) 0 49.3%, rgba(255,255,255,.38) 49.3% 50.2%, var(--t2) 50.2% 100%);
    position: relative; height: 188px;
    background: var(--spot), var(--fade), var(--split);
  }
  .mono .stage { --split: linear-gradient(112deg, var(--t1), color-mix(in srgb, var(--c1) 26%, #0a0d13)); }
  .stage::after { /* ground shadow */
    content: ""; position: absolute; left: 50%; bottom: 48px; width: 104px; height: 15px;
    transform: translateX(-50%); z-index: 0;
    background: radial-gradient(closest-side, rgba(0,0,0,.5), transparent);
  }
  .id {
    position: absolute; top: 11px; left: 14px; z-index: 2;
    font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: .02em;
    color: #fff; text-shadow: 0 1px 10px rgba(0,0,0,.5);
  }
  .sprite {
    position: absolute; z-index: 1; inset: 30px 0 54px;
    display: grid; justify-items: center; align-items: end;
  }
  .sprite img { display: block; }
  .types { position: absolute; z-index: 2; left: 10px; right: 10px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .type {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px 3px 4px; border-radius: 999px;
    background: rgba(7,9,13,.62); border: 1px solid rgba(255,255,255,.2);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    font-size: 13.5px; font-weight: 600;
  }
  .type img { width: 24px; height: 24px; display: block; }

  .body { flex: 1; display: flex; flex-direction: column; gap: 13px; padding: 15px 16px 16px; }
  .name {
    margin: 0; font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1.1;
    letter-spacing: .005em; overflow-wrap: anywhere;
  }
  .abilities { display: flex; flex-wrap: wrap; gap: 6px; }
  .ability {
    display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px 4px 9px; border-radius: 8px;
    background: var(--panel-2); border: 1px solid var(--line); color: #dbe3f4;
    font-size: 13.5px; font-weight: 500; text-decoration: none;
    transition: border-color .15s, background .15s;
  }
  a.ability:hover {
    border-color: color-mix(in srgb, var(--c1) 70%, var(--line));
    background: color-mix(in srgb, var(--c1) 16%, var(--panel-2));
    color: #fff;
  }
  .ability svg { width: 9px; height: 9px; flex: none; color: color-mix(in srgb, var(--c1) 62%, #fff); }

  .stats { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .stat { display: grid; grid-template-columns: 52px 30px 1fr; align-items: center; gap: 8px; font-size: 13px; }
  .stat .k { color: var(--muted); font-weight: 600; }
  .stat .v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat.hi .v { color: var(--volt); }
  .bar { height: 7px; border-radius: 99px; background: #0a0d14; overflow: hidden; }
  .bar > i {
    display: block; height: 100%; border-radius: 99px; width: var(--w);
    background: linear-gradient(90deg, color-mix(in srgb, var(--k) 62%, #000), var(--k));
  }
  .js .bar > i { width: 0; transition: width .75s cubic-bezier(.2,.7,.2,1) var(--d, 0ms); }
  .js .card.in .bar > i { width: var(--w); }

  .total {
    margin-top: auto; padding-top: 11px; border-top: 1px solid var(--line);
    display: flex; align-items: baseline; justify-content: space-between;
    color: var(--muted); font-weight: 600; font-size: 14px;
  }
  .total b { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; color: var(--text); font-variant-numeric: tabular-nums; }


  /* ───────── expandable card ───────── */
  .card.can-open { cursor: pointer; }
  .expander {
    position: absolute; top: 9px; right: 10px; z-index: 3; height: 32px; padding: 0 9px 0 13px;
    display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
    color: var(--text); font-size: 13px; font-weight: 600;
    background: rgba(7,9,13,.62); border: 1px solid rgba(255,255,255,.28); border-radius: 999px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: background .15s, border-color .15s;
  }
  .expander:hover { background: rgba(7,9,13,.84); border-color: var(--volt); }
  .expander svg { width: 16px; height: 16px; transition: transform .25s; }
  .card.open .expander svg { transform: rotate(180deg); }

  .detail { display: none; }
  .card.open {
    grid-column: 1 / -1; cursor: default; display: grid; grid-template-columns: minmax(0, 1fr);
    border-color: color-mix(in srgb, var(--c1) 80%, #fff 6%);
    box-shadow: 0 18px 50px rgba(0,0,0,.45), 0 0 0 1px color-mix(in srgb, var(--c1) 35%, transparent);
  }
  .card.open[hidden] { display: none; }
  .card.open .detail { display: block; }

  .detail {
    padding: 20px 22px 24px; border-top: 1px solid var(--line);
    background: linear-gradient(180deg, color-mix(in srgb, var(--c1) 8%, var(--panel)), var(--panel) 70%);
  }
  .d-sec + .d-sec { margin-top: 24px; }
  .detail h3 {
    margin: 0 0 12px; display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
    font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1.2; letter-spacing: .01em;
  }
  .who {
    padding: 2px 11px; border-radius: 999px; font: 600 13px var(--body); letter-spacing: 0;
    background: color-mix(in srgb, var(--c1) 28%, #0b0e14); border: 1px solid color-mix(in srgb, var(--c1) 60%, transparent);
  }

  .evo { display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
  .evo-branches { display: flex; flex-direction: column; gap: 10px; flex: 1 1 0; min-width: 0; }
  .evo-branch { display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
  .evo-branch + .evo-branch::before { content: "or"; align-self: center; padding: 1px 10px; border-radius: 999px; font: 700 11px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line-2); }
  @media (min-width: 700px) { .evo-branch + .evo-branch::before { display: none; } }
  .evo-node {
    flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 9px; padding: 11px;
    border-radius: 14px; background: color-mix(in srgb, var(--c1) 9%, var(--panel-2));
    border: 1px solid color-mix(in srgb, var(--c1) 28%, var(--line));
    transition: border-color .15s, background .15s;
  }
  .evo-node:hover { border-color: color-mix(in srgb, var(--c1) 65%, var(--line)); }
  .evo-node.active {
    background: color-mix(in srgb, var(--c1) 22%, var(--panel-2));
    border-color: color-mix(in srgb, var(--c1) 85%, #fff 5%);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c1) 50%, transparent);
  }
  .evo-pick {
    display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 11px; align-items: center;
    padding: 0; border: 0; background: none; color: inherit; text-align: left; cursor: pointer;
  }
  .evo-pick:focus-visible { outline-offset: 4px; border-radius: 10px; }
  .thumb {
    width: 64px; height: 64px; display: grid; place-items: center; border-radius: 12px;
    background: radial-gradient(circle at 50% 72%, rgba(255,255,255,.16), transparent 70%), color-mix(in srgb, var(--c1) 28%, #0a0d13);
  }
  .thumb img { display: block; }
  .evo-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .evo-id { font-family: var(--display); font-weight: 800; font-size: 13px; color: var(--muted); }
  .evo-name { font-family: var(--display); font-weight: 800; font-size: 18px; line-height: 1.1; overflow-wrap: anywhere; }
  .evo-types { display: flex; gap: 4px; margin-top: 5px; }
  .evo-types img { width: 20px; height: 20px; display: block; }
  .evo-abil { display: flex; flex-wrap: wrap; gap: 5px; }
  .evo-abil .ability { font-size: 12.5px; padding: 3px 9px 3px 7px; }
  .evo-arrow {
    flex: none; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 10px; padding: 2px 0;
    color: var(--muted); font-size: 12.5px; font-weight: 600; text-align: center;
  }
  .evo-arrow svg { width: 36px; height: 14px; color: var(--volt); transform: rotate(90deg); }
  .evo-arrow .how { max-width: 150px; }
  .evo-arrow .how svg { width: 15px; height: 15px; transform: none; color: currentColor; }

  .moves-wrap {
    position: relative; height: 212px; border-radius: 14px; overflow: hidden;
    background: color-mix(in srgb, var(--c1) 5%, #0b0e14); border: 1px solid var(--line);
  }
  .moves-wrap::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 26px; pointer-events: none;
    background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--c1) 5%, #0b0e14));
  }
  .moves-scroll {
    height: 100%; overflow-y: auto; padding: 10px 10px 26px; overscroll-behavior: contain;
    scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--c1) 55%, #333) transparent;
  }
  .moves-wrap .no-moves { height: 100%; display: grid; place-items: center; }
  .moves {
    list-style: none; margin: 0; padding: 0; display: grid; gap: 6px;
    grid-template-columns: repeat(auto-fill, minmax(212px, 1fr));
  }
  .count { font: 600 13px var(--body); letter-spacing: 0; color: var(--muted); }
  .move {
    display: flex; align-items: center; gap: 10px; padding: 5px 12px 5px 5px; border-radius: 10px;
    color: var(--text); text-decoration: none; font-size: 14.5px; font-weight: 600;
    background: color-mix(in srgb, var(--mc) 15%, var(--panel-2));
    border: 1px solid color-mix(in srgb, var(--mc) 38%, transparent);
    transition: background .15s, border-color .15s, transform .15s;
  }
  .move:hover { background: color-mix(in srgb, var(--mc) 28%, var(--panel-2)); border-color: color-mix(in srgb, var(--mc) 80%, #fff 5%); transform: translateY(-1px); }
  .move:focus-visible { outline: 2px solid var(--volt); outline-offset: 2px; }
  .mname { min-width: 0; overflow-wrap: anywhere; }
  .lv {
    flex: none; min-width: 48px; padding: 3px 7px; border-radius: 7px; text-align: center;
    font-family: var(--display); font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; color: #fff;
    background: color-mix(in srgb, var(--mc) 62%, #0a0d13); border: 1px solid color-mix(in srgb, var(--mc) 70%, transparent);
    text-shadow: 0 1px 1px rgba(0,0,0,.45);
  }
  .lv small { margin-right: 3px; font-family: var(--body); font-weight: 600; font-size: 10.5px; opacity: .8; }
  .no-moves { margin: 0; color: var(--muted); }

  /* wide screens: stage | stats | evolution + moves, side by side */
  @media (min-width: 700px) {
    .card.open { grid-template-columns: 300px minmax(0, 1fr); grid-template-areas: "stage info" "detail detail"; }
    .card.open .stage { grid-area: stage; }
    .card.open .body { grid-area: info; }
    .card.open .detail { grid-area: detail; }
    .card.open .stage { height: auto; min-height: 380px; }
    .card.open .stage {
      --spot: radial-gradient(210px 170px at 50% 58%, rgba(255,255,255,.22), transparent 72%);
    }
    .card.open .sprite { inset: auto 0 100px; height: 190px; }
    .card.open .sprite img { transform: scale(1.7); transform-origin: 50% 100%; image-rendering: pixelated !important; }
    .card.open .stage::after { bottom: 92px; width: 160px; height: 22px; }
    .card.open .body { padding: 22px 24px 22px; }
    .card.open .name { font-size: 30px; }
  }
  @media (min-width: 700px) {
    .evo { flex-direction: row; align-items: stretch; gap: 8px; }
    .evo-branch { flex-direction: row; gap: 8px; }
    .evo-branch .evo-node { flex: 1 1 0; }
    .evo-arrow { flex-direction: column; min-width: 78px; gap: 3px; }
    .evo-arrow svg { transform: none; }
    .detail { padding: 22px 24px 26px; }
  }


  /* ───────── TMs & HMs drawer (inside the open card) ───────── */
  .tm-sec { --tc: var(--c1); }
  .tm-h { margin: 0; }
  .tm-toggle {
    width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 14px;
    padding: 12px 16px 12px 12px; border-radius: 14px; cursor: pointer; text-align: left; color: var(--text);
    background:
      radial-gradient(120% 140% at 0% 50%, color-mix(in srgb, var(--tc) 26%, transparent), transparent 60%),
      linear-gradient(90deg, color-mix(in srgb, var(--tc) 10%, var(--panel-2)), var(--panel-2));
    border: 1px solid color-mix(in srgb, var(--tc) 38%, var(--line));
    transition: border-color .2s, box-shadow .2s, border-radius .3s;
  }
  .tm-toggle:hover { border-color: color-mix(in srgb, var(--tc) 80%, #fff 6%); box-shadow: 0 6px 22px rgba(0,0,0,.35); }
  .tm-sec.open .tm-toggle { border-radius: 14px 14px 0 0; border-bottom-color: transparent; }
  .tm-disc {
    width: 46px; height: 46px; flex: none; display: grid; place-items: center; border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, rgba(255,255,255,.22), transparent 62%), color-mix(in srgb, var(--tc) 34%, #0a0d13);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--tc) 60%, transparent), 0 4px 16px color-mix(in srgb, var(--tc) 40%, transparent);
  }
  .tm-disc img { width: 30px; height: 30px; display: block; image-rendering: pixelated; transition: transform .45s cubic-bezier(.2,.7,.2,1); }
  .tm-sec.open .tm-disc img { transform: translateY(-3px); }
  .tm-title { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-width: 0; }
  .tm-title b { font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: .01em; line-height: 1.15; }
  .tm-sub { flex-basis: 100%; color: var(--muted); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tm-new-n {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; white-space: nowrap;
    font-size: 12.5px; font-weight: 700; color: #0b0e14; background: var(--volt);
    box-shadow: 0 0 16px rgba(255,203,5,.35);
  }
  .tm-new-n[hidden] { display: none; }
  .tm-chev {
    width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%;
    background: rgba(7,9,13,.5); border: 1px solid rgba(255,255,255,.18);
  }
  .tm-chev svg { width: 17px; height: 17px; transition: transform .3s; }
  .tm-sec.open .tm-chev svg { transform: rotate(180deg); }

  /* ───────── new evolution methods (separate section) ───────── */
  .evo-sec { margin-top: 44px; scroll-margin-top: 84px; }
  .evo-sec[hidden], .evo-card[hidden], .evo-row[hidden], .grid[hidden] { display: none; }
  .sec-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 14px; margin: 0 0 6px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .sec-head h2 { margin: 0; font-family: var(--display); font-weight: 800; font-stretch: 115%; font-size: clamp(24px, 3.4vw, 32px); line-height: 1.1; }
  .sec-head .sec-n { color: var(--muted); font-weight: 600; font-size: 14.5px; font-variant-numeric: tabular-nums; }
  .sec-sub { margin: 0 0 18px; color: var(--muted); font-size: 15px; }
  .evo-grid { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .evo-card {
    --c1: #6b7a9c;
    border-radius: 16px; overflow: hidden; background: var(--panel);
    border: 1px solid color-mix(in srgb, var(--c1) 30%, var(--line));
  }
  .evo-row { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; padding: 12px 14px; }
  .evo-row + .evo-row { border-top: 1px dashed var(--line-2); }
  .ec-mon { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; text-align: center; }
  .ec-spr {
    --c: #6b7a9c;
    flex: none; width: 64px; height: 64px; display: grid; place-items: center; border-radius: 14px;
    background: radial-gradient(circle at 50% 75%, rgba(255,255,255,.18), transparent 70%), color-mix(in srgb, var(--c) 32%, #0a0d13);
    border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
  }
  .ec-spr img { display: block; }
  .ec-id { display: block; color: var(--muted); font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .ec-name { display: block; font-family: var(--display); font-weight: 800; font-size: 17px; line-height: 1.15; }
  .ec-types { display: flex; gap: 3px; margin-top: 3px; }
  .ec-types { justify-content: center; }
  .ec-types img { width: 18px; height: 18px; display: block; }
  .ec-how { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; max-width: 160px; padding-bottom: 22px; }
  .ec-how svg.arr { width: 44px; height: 14px; color: var(--muted); }
  .how {
    --k: #4a82e8;
    display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px 4px 6px; border-radius: 10px; text-align: center;
    font-size: 12.5px; font-weight: 700; line-height: 1.2; color: #fff;
    background: color-mix(in srgb, var(--k) 22%, #0b0e14); border: 1px solid color-mix(in srgb, var(--k) 60%, transparent);
  }
  .how.level { --k: #38c6ff; }
  .how.item { --k: #ffcb05; }

  .how img { width: 24px; height: 24px; flex: none; image-rendering: pixelated; }
  .how svg { width: 15px; height: 15px; flex: none; }
  .how .t-ico, .evo-arrow .how .t-ico { width: 15px; height: 15px; flex: none; transform: none; }
  .how.night .t-ico { color: #c9b8ff; }
  .how.day .t-ico { color: #ffcb05; }
  .how.other { --k: #8e9ab2; padding-left: 10px; }
  .how small { display: block; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .evo-err { color: var(--muted); font-size: 14.5px; }
  @media (max-width: 560px) {

  .empty { text-align: center; color: var(--muted); padding: 70px 0 30px; font-size: 17px; }

  /* ───────── footer ───────── */
  .site-footer {
    padding: 34px 0 44px; text-align: center; border-top: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(47,123,255,.12), transparent 80%);

  /* ───────── back to top ───────── */
  .to-top {
    position: fixed; right: 18px; bottom: 18px; z-index: 40; width: 48px; height: 48px; border-radius: 50%;
    display: grid; place-items: center; border: 0; cursor: pointer;

  /* ───────── boxes: line strip, tags, changed badge ───────── */

  .line-mini i { font-style: normal; opacity: .6; }
  .lm { cursor: pointer; padding: 1px 6px; border-radius: 6px; font-weight: 600; transition: background .15s, color .15s; }
  .lm:hover { color: var(--text); background: color-mix(in srgb, var(--c1) 22%, transparent); }
  .lm.on { color: var(--text); background: color-mix(in srgb, var(--c1) 30%, var(--panel-2)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c1) 60%, transparent); }

  .wa-ico { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 7px; color: var(--mk); background: color-mix(in srgb, var(--mk) 16%, transparent); }

  .wa-m { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .wa-pill { padding: 1px 8px; border-radius: 999px; font: 800 10.5px var(--display); letter-spacing: .06em; text-transform: uppercase; }
  .wa-pill.post { color: #d9c2ff; background: rgba(150,100,255,.16); border: 1px solid rgba(150,100,255,.45); }
  .wa-pill.grotto { color: #9ef0c0; background: rgba(60,200,120,.14); border: 1px solid rgba(60,200,120,.4); }

  .wa-pill.v-W2 { color: #111; background: #eef1f6; border: 1px solid #fff; }
  .wa-pill.ev { color: #0b0e14; background: var(--volt); }
  .wa-pill.rar-common { color: #b9c6dc; background: #0b0e14; border: 1px solid var(--line-2); }
  .wa-pill.rar-uncommon { color: #8fd0ff; background: rgba(47,123,255,.14); border: 1px solid rgba(47,123,255,.45); }
  .wa-pill.rar-rare { color: #ffd76a; background: rgba(255,203,5,.12); border: 1px solid rgba(255,203,5,.45); }
  .wa-pill.rar-guaranteed { color: #0b0e14; background: #9ef0c0; }
  .wa-none { padding: 16px; border-radius: 13px; background: var(--panel-2); border: 1px dashed var(--line-2); color: var(--muted); font-size: 14px; text-align: center; }
  .wa-none strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }
  .wa-jumps { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 10px; }
  @media (max-width: 520px) {
    .wa-row { grid-template-columns: 22px minmax(0, 1fr) minmax(56px, max-content); }
    .wa-l { grid-column: 2; grid-row: 2; margin-top: -4px; }
    .wa-row .wa-r { grid-row: 1 / span 2; grid-column: 3; }
    .mu-row { grid-template-columns: 50px minmax(0, 1fr); }
  }

  /* BST range: one track, two handles */
  .bst-filter { display: flex; align-items: center; gap: 12px; max-width: 560px; }
  .bst-lbl { font: 800 12px var(--display); letter-spacing: .08em; color: var(--muted); }

  .dual { position: relative; flex: 1 1 auto; height: 28px; }
  .dual-track { position: absolute; left: 0; right: 0; top: 50%; height: 6px; margin-top: -3px; border-radius: 99px; background: var(--line-2); }
  .dual-fill { position: absolute; top: 0; bottom: 0; border-radius: 99px; background: linear-gradient(90deg, var(--bolt), var(--volt)); }
  .dual input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; }
  .dual input::-webkit-slider-runnable-track { background: none; border: 0; }
  .dual input::-moz-range-track { background: none; border: 0; }
  .dual input::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 20px; height: 20px; border-radius: 50%; cursor: grab;
    background: #fff; border: 3px solid var(--bolt); box-shadow: 0 2px 8px rgba(0,0,0,.45); transition: transform .15s; }
  .dual input::-moz-range-thumb { pointer-events: auto; width: 14px; height: 14px; border-radius: 50%; cursor: grab;
    background: #fff; border: 3px solid var(--bolt); box-shadow: 0 2px 8px rgba(0,0,0,.45); }
  .dual input:active::-webkit-slider-thumb { transform: scale(1.15); cursor: grabbing; }
  .dual input:focus-visible { outline: none; }
  .dual input:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px rgba(255,203,5,.45); }
  .dual input:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 4px rgba(255,203,5,.45); }
  .bst-filter.on .bst-val { color: var(--volt); }
  .count { font-size: 14px; }
  .count b { color: var(--text); font-family: var(--display); font-weight: 800; }

  /* grid & cards */
  main { padding-top: 24px; }
  .grid { gap: 20px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .card {
    border-radius: var(--r-lg);
    background: linear-gradient(180deg, color-mix(in srgb, var(--c1) 7%, var(--panel)) 0%, var(--panel) 46%);
    box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 8px 22px rgba(0,0,0,.28);
    transition: border-color .2s, transform .25s cubic-bezier(.2,.7,.2,1), box-shadow .25s;
  }
  .card:not(.open):hover {
    transform: translateY(-4px);
    box-shadow: 0 1px 0 rgba(255,255,255,.05) inset, 0 20px 40px rgba(0,0,0,.45), 0 0 0 1px color-mix(in srgb, var(--c1) 40%, transparent), 0 12px 40px -12px color-mix(in srgb, var(--c1) 55%, transparent);
  }

  /* stage: the type split + a Poké Ball watermark */
  .stage { height: 196px; overflow: hidden; }
  .stage::before {
    content: ""; position: absolute; right: -46px; top: -40px; width: 200px; height: 200px; z-index: 0; opacity: .13; pointer-events: none;
    background: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg fill='none' stroke='white' stroke-width='7'%3E%3Ccircle cx='50' cy='50' r='44'/%3E%3Cpath d='M6 50h28M66 50h28'/%3E%3Ccircle cx='50' cy='50' r='15'/%3E%3C/g%3E%3C/svg%3E") center / contain no-repeat;
    transform: rotate(-18deg); transition: transform .6s cubic-bezier(.2,.7,.2,1);
  }
  .card:hover .stage::before { transform: rotate(10deg); }
  .id {
    display: inline-flex; align-items: center; top: 12px; left: 12px; padding: 3px 10px 3px 11px; border-radius: 999px;
    font-size: 17px; background: rgba(7,9,13,.42); border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .chg { margin-left: 7px; vertical-align: 0; }
  .sprite img { transition: transform .35s cubic-bezier(.2,.7,.2,1), filter .35s; filter: drop-shadow(0 6px 8px rgba(0,0,0,.35)); }
  .card:not(.open):hover .sprite img { transform: translateY(-6px) scale(1.06); }
  .stage::after { transition: width .35s, opacity .35s; }
  .card:not(.open):hover .stage::after { width: 84px; opacity: .7; }
  .types { gap: 5px; }
  .type { padding: 3px 11px 3px 4px; font-size: 13px; }
  .expander { top: 11px; right: 11px; height: 30px; padding: 0 8px 0 12px; font-size: 12.5px; }
  .ex-l { letter-spacing: .02em; }

  /* body */
  .body { gap: 12px; padding: 14px 16px 16px; }
  .name { font-size: 25px; }
  .line-mini { display: flex; flex-wrap: wrap; gap: 5px; margin-top: -4px; }
  .line-mini i { display: none; }
  .lm {
    display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px 0 3px; border-radius: 999px; cursor: pointer;
    font: 600 12.5px var(--body); color: var(--muted); background: var(--panel-2); border: 1px solid var(--line);
    transition: color .15s, background .15s, border-color .15s;
  }
  .lm:hover { color: var(--text); border-color: color-mix(in srgb, var(--c1) 55%, var(--line)); }
  .lm.on { color: var(--text); background: color-mix(in srgb, var(--c1) 24%, var(--panel-2)); border-color: color-mix(in srgb, var(--c1) 70%, transparent); box-shadow: none; }
  .lm-s { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; background: rgba(255,255,255,.06); }
  .lm-s img { display: block; }
  .abilities { gap: 5px; }
  .ability { font-size: 13px; padding: 4px 10px 4px 8px; }

  .b-stats { display: grid; gap: 14px; }
  .b-radar { display: none; }
  .stats { gap: 7px; }
  .stat { grid-template-columns: 50px 30px 1fr; gap: 9px; font-size: 12.5px; }
  .stat .k { letter-spacing: .03em; }
  .bar { height: 8px; background: rgba(255,255,255,.06); }
  .bar > i { background: linear-gradient(90deg, color-mix(in srgb, var(--k) 55%, #0b0e14), var(--k)); box-shadow: 0 0 12px -2px color-mix(in srgb, var(--k) 60%, transparent); }
  .total { gap: 10px; padding-top: 12px; margin-top: 14px; font-size: 13.5px; }
  .total span:first-child { margin-right: auto; }
  .total b { font-size: 28px; }
  .bst-meter { display: block; height: 4px; margin-top: 8px; border-radius: 99px; background: rgba(255,255,255,.06); overflow: hidden; }
  .bst-meter i { display: block; height: 100%; width: var(--w); border-radius: 99px; background: linear-gradient(90deg, var(--c1), var(--c2)); }

  /* radar */
  .radar { display: block; width: 100%; max-width: 280px; height: auto; margin: 0 auto; overflow: visible; }
  .r-ring { fill: rgba(255,255,255,.02); stroke: rgba(255,255,255,.1); stroke-width: 1; }
  .r-axis { stroke: rgba(255,255,255,.08); stroke-width: 1; }
  .r-val { fill: color-mix(in srgb, var(--rc) 34%, transparent); stroke: var(--rc); stroke-width: 2.2; stroke-linejoin: round; filter: drop-shadow(0 0 10px color-mix(in srgb, var(--rc) 55%, transparent)); }
  .r-lbl { fill: var(--muted); font: 700 10.5px var(--body); letter-spacing: .05em; text-anchor: middle; text-transform: uppercase; }
  .r-num { font: 800 13px var(--display); text-anchor: middle; }
  .js .card:not(.in) .r-val { opacity: 0; }
  .r-val { transition: opacity .6s; }

  /* open card */
  .card.open { border-radius: 24px; }
  .card.open .b-radar { display: block; }
  @media (min-width: 700px) {
    .card.open { grid-template-columns: 320px minmax(0, 1fr); }
    .card.open .stage { min-height: 420px; }
    .card.open .stage::before { width: 300px; height: 300px; right: -90px; top: -70px; opacity: .08; }
    .card.open .body { padding: 26px 28px 24px; gap: 14px; }
    .card.open .name { font-size: 34px; }
    .card.open .b-stats { grid-template-columns: minmax(0, 1fr) 260px; align-items: center; gap: 26px; }
  }
  @media (min-width: 1100px) { .card.open .b-stats { grid-template-columns: minmax(0, 1fr) 300px; } }
  .card.open .b-radar { padding: 6px; border-radius: 18px; background: radial-gradient(circle at 50% 48%, color-mix(in srgb, var(--c1) 12%, transparent), transparent 70%); }
  .detail { padding: 22px 24px 26px; background: linear-gradient(180deg, color-mix(in srgb, var(--c1) 9%, var(--panel)), var(--panel) 60%); }
  .d-sec + .d-sec { margin-top: 26px; }
  .detail h3 { font-size: 18px; }
  .h-ico { width: 26px; height: 26px; display: inline-grid; place-items: center; border-radius: 8px; color: var(--volt); background: rgba(255,203,5,.1); border: 1px solid rgba(255,203,5,.3); }
  .h-ico svg { width: 15px; height: 10px; }
  .evo-node { border-radius: 16px; transition: border-color .15s, background .15s, transform .15s; }
  .evo-node:hover { transform: translateY(-2px); }
  .thumb { border-radius: 14px; }

  /* moves: one panel with tabs */
  .learn-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .learn-head h3 { margin: 0; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 14px; background: #0b0e14; border: 1px solid var(--line); }
  .learn-tab {
    display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px 0 9px; border-radius: 10px; cursor: pointer;
    font: 700 14px var(--body); color: var(--muted); background: transparent; border: 1px solid transparent;
    transition: color .15s, background .15s, border-color .15s;
  }
  .learn-tab:hover { color: var(--text); background: rgba(255,255,255,.04); }
  .learn-tab[aria-selected="true"] {
    color: var(--text); background: color-mix(in srgb, var(--tc) 26%, #121722);
    border-color: color-mix(in srgb, var(--tc) 65%, transparent); box-shadow: 0 6px 18px -8px color-mix(in srgb, var(--tc) 70%, transparent);
  }
  .lt-ico { width: 22px; height: 22px; display: grid; place-items: center; }
  .lt-ico svg { width: 17px; height: 17px; }
  .lt-ico img { width: 22px; height: 22px; image-rendering: pixelated; }
  .lt-n { min-width: 24px; padding: 1px 7px; border-radius: 999px; font: 700 12px var(--body); text-align: center; color: var(--text); background: rgba(255,255,255,.08); font-variant-numeric: tabular-nums; }
  .lt-new { padding: 1px 8px; border-radius: 999px; font: 800 11.5px var(--body); color: #0b0e14; background: var(--volt); }
  .tab-panel { display: none; animation: panelIn .28s cubic-bezier(.2,.7,.2,1); }
  .learn[data-tab="lv"] [data-p="lv"], .learn[data-tab="tm"] [data-p="tm"], .learn[data-tab="tut"] [data-p="tut"] { display: block; }
  @keyframes panelIn { from { opacity: 0; transform: translateY(6px); } }
  .tab-panel .tm-inner { overflow: visible; border-radius: 16px; border: 1px solid var(--line); background: color-mix(in srgb, var(--tc) 5%, #0b0e14); }
  .tab-panel .tms li { animation: tmIn .32s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(min(var(--i), 24) * 12ms); }
  .moves-wrap { height: auto; max-height: 330px; min-height: 120px; border-radius: 16px; }
  .moves-scroll { max-height: 330px; height: auto; }

  @media (max-width: 699px) {
    .search-row { flex-wrap: wrap; }
    .search { flex-basis: 100%; }
    .sort { flex: 1; }
    .sort select { flex: 1; }
    .card.open .b-radar { margin-top: 4px; }
    .learn-head { align-items: stretch; }
    .tabs { width: 100%; }
    .learn-tab { flex: 1 1 auto; justify-content: center; padding: 0 8px; gap: 6px; font-size: 13px; }
    .lt-new { display: none; }
    .detail { padding: 18px 14px 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stage::before, .sprite img, .card, .tab-panel, .tab-panel .tms li { transition: none; animation: none; }
  }

  /* ───────── motion: short, soft, never in the way ───────── */
  @media (prefers-reduced-motion: no-preference) {
    /* the sprite pops in whenever the card shows another Pokémon */
    .sprite img, .thumb img, .lm-s img { animation: spriteIn .42s cubic-bezier(.2,.8,.2,1.2) both; }
    @keyframes spriteIn { from { opacity: 0; transform: translateY(6px) scale(.9); } }
    .b-head .name { animation: fadeUp .35s ease both; }
    .types .type { animation: fadeUp .35s ease both; }
    .types .type + .type { animation-delay: .05s; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } }
    /* bars and the BST meter fill when the card appears */
    .bst-meter i { transition: width .8s cubic-bezier(.2,.7,.2,1) .25s; }
    .js .card:not(.in) .bst-meter i { width: 0; }
    /* radar grows from the centre */
    .card.open .r-val { transform-origin: 120px 112px; animation: radarIn .6s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes radarIn { from { opacity: 0; transform: scale(.4); } }
    /* opening a card */
    .card.open .detail { animation: detailIn .4s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes detailIn { from { opacity: 0; transform: translateY(10px); } }
    .card.open .d-sec { animation: fadeUp .4s ease both; }
    .card.open .d-sec + .d-sec { animation-delay: .08s; }
    .expander svg { transition: transform .3s cubic-bezier(.2,.7,.2,1); }
    /* small presses */
    .chip, .lm, .learn-tab, .tm-filter, .reset, .expander { transition: transform .15s, background .15s, border-color .15s, color .15s; }
    .chip:active, .lm:active, .learn-tab:active, .tm-filter:active, .reset:active, .expander:active { transform: scale(.96); }
    .chip[aria-pressed="true"] img { animation: chipPop .3s cubic-bezier(.2,.8,.2,1.4); }
    @keyframes chipPop { 50% { transform: scale(1.18); } }
    .move, .tm { transition: background .15s, border-color .15s, transform .15s; }
    .hero .logo { animation: heroIn .7s cubic-bezier(.2,.7,.2,1) both; }
    .hero h1, .hero-stats { animation: fadeUp .6s ease .12s both; }
    @keyframes heroIn { from { opacity: 0; transform: translateY(-8px) scale(.98); } }
  }
</style>
</head>

<script>
// Data lives in assets/data/pokedex.json (same repo): edit that file, not this page.
// pokedex.json lists every Pokémon ONCE; "evo": {from, method} links it to its pre-evolution.
// This page builds the boxes: one per final evolution, pre-evolutions inside.
const RAW = "https://raw.githubusercontent.com/lucaremix/pokemon-pitch-black-2/main/";
const DATA_URLS = [RAW + "assets/data/pokedex.json", "assets/data/pokedex.json"];
const TM_URLS = [RAW + "assets/data/tms.json", "assets/data/tms.json"];
const TUTOR_URLS = [RAW + "assets/data/tutors.json", "assets/data/tutors.json"];
const MOVE_CHANGES_URLS = [RAW + "assets/data/move_changes.json", "assets/data/move_changes.json"];
const WILD_URLS = [RAW + "assets/data/wild_areas.json", "assets/data/wild_areas.json"];

const TYPE_ICONS = {};
["Normal","Fighting","Flying","Poison","Ground","Rock","Bug","Ghost","Fire","Water","Grass","Electric","Psychic","Ice","Dragon","Dark","Steel","Fairy","Sound"]

// One style for every Pokémon: the Black/White (gen 5) sprites from PokeAPI, which exist for all of them.
// pokedex.json has a "sprite" only for forms (their own PokeAPI number). If an image fails, the HOME image, then a Poké Ball.
const PK = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/";
const SPRITE_CHAIN = [
  (id) => PK + "versions/generation-v/black-white/" + id + ".png",
  (id) => PK + "other/home/" + id + ".png"
];
function spriteURL(p) { return p.sprite || SPRITE_CHAIN[0](p.pokedex_id); }
function spriteKey(p) {
  const m = String(p.sprite || "").match(/\/(\d+)\.(?:gif|png)$/);
  return m ? m[1] : p.pokedex_id;
}
function spriteFail(img) {
  delete img.dataset.c;
  const n = (+img.dataset.f || 0) + 1;
  img.dataset.f = n;
  if (n < SPRITE_CHAIN.length) { img.crossOrigin = "anonymous"; img.src = SPRITE_CHAIN[n](img.dataset.k); }
  else { img.onerror = null; img.dataset.c = "1"; img.src = PLACEHOLDER; }
}
function spriteImg(p, box, extra) {
  const url = spriteURL(p), c = CROPPED.get(url);
  return '<img ' + (box ? 'data-box="' + box + '" ' : "") + 'data-k="' + esc(spriteKey(p)) + '" src="' + esc(c || url) + '" ' + (extra || 'alt=""') +
    (c ? ' data-c="1"' : ' crossorigin="anonymous"') + ' loading="lazy" onload="fitSprite(this)" onerror="spriteFail(this)">';
}

// Gen 5 sprites sit in a 96×96 canvas with empty margins: crop them once, then every Pokémon fills the same box.
const CROPPED = new Map();
function cropSprite(img) {
  if (img.dataset.c) return false;
  img.dataset.c = "1";
  try {
    const w = img.naturalWidth, h = img.naturalHeight, cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    const cx = cv.getContext("2d"); cx.drawImage(img, 0, 0);
    const a = cx.getImageData(0, 0, w, h).data;
    let x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (a[(y * w + x) * 4 + 3] > 8) {
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
    if (x1 < 0 || (x1 - x0 + 1 === w && y1 - y0 + 1 === h)) return false;
    const out = document.createElement("canvas");
    out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
    out.getContext("2d").drawImage(cv, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
    const url = out.toDataURL();
    CROPPED.set(img.currentSrc || img.src, url);
    img.src = url;
    return true;
  } catch (e) { return false; }   // no CORS: keep the uncropped image
}

// Every sprite is scaled so its longest side equals the same box: all Pokémon show at one size.
const SPRITE_BOX = 96;
function fitSprite(img) {
  if (cropSprite(img)) return;     // fitSprite runs again when the cropped image loads
  const w = img.naturalWidth, h = img.naturalHeight;
  if (!w || !h) return;
  const k = (+img.dataset.box || SPRITE_BOX) / Math.max(w, h);
  img.style.width = Math.round(w * k) + "px";
  img.style.height = Math.round(h * k) + "px";
  img.style.imageRendering = "pixelated";
}

function statColor(v) {
  if (v >= 110) return "#ffcb05";
  if (v >= 90) return "#38c6ff";
  if (v >= 60) return "#4a82e8";
  return "#6b7a9c";
}

function typesOf(p) { return [p.type1, p.type2].filter(Boolean); }
function colorsOf(types) {
  const c1 = TYPE_COLORS[types[0]] || "#6b7a9c";
  const c2 = types[1] ? (TYPE_COLORS[types[1]] || c1) : c1;
  return [c1, c2];
}

function typeBadge(t) {
  const icon = TYPE_ICONS[t] || "";
  return '<span class="type">' +

    esc(t) + "</span>";
}

// head = a Pokémon nothing evolves from (Paradox Pokémon don't count); the box holds its line.
// Paradox Pokémon: box with only the Pokémon they come from. Forms (form_of): inside the box of the base form.
function buildBoxes(LIST) {
  const by = new Map(LIST.map((p) => [p.name, p]));
  const isForm = (p) => p.form_of && p.evo && p.evo.from === p.form_of;
  const hasChild = new Set();
  LIST.forEach((p) => { if (p.evo && !p.paradox && !isForm(p)) hasChild.add(p.evo.from); });
  const boxes = [];
  LIST.forEach((p) => {
    if (isForm(p) || hasChild.has(p.name)) return;
    let line = [p];
    if (p.paradox) { if (p.evo && by.has(p.evo.from)) line.unshift(by.get(p.evo.from)); }
    else {
      for (let c = p, guard = 0; c.evo && by.has(c.evo.from) && guard < 6; guard++) { c = by.get(c.evo.from); line.unshift(c); }
    }
    const forms = LIST.filter((q) => isForm(q) && q.form_of === p.name);
    boxes.push({ head: p, line, forms, members: line.concat(forms) });
  });
  return boxes.sort((a, b) => a.head.pokedex_id - b.head.pokedex_id);
}

const ICON_CROP = new Map();
function fitIcon(img) {
  if (img.dataset.c) return;
  img.dataset.c = "1";
  const src = img.currentSrc || img.src;
  try {
    const w = img.naturalWidth, h = img.naturalHeight, cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    const cx = cv.getContext("2d"); cx.drawImage(img, 0, 0);
    const a = cx.getImageData(0, 0, w, h).data;
    let x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (a[(y * w + x) * 4 + 3] > 8) {
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
    if (x1 < 0) throw 0;
    const cw = x1 - x0 + 1, ch = y1 - y0 + 1, out = document.createElement("canvas");
    out.width = cw; out.height = ch;
    out.getContext("2d").drawImage(cv, x0, y0, cw, ch, 0, 0, cw, ch);
    const k = Math.min(1, 40 / cw, 30 / ch);
    const c = { src: out.toDataURL(), w: Math.round(cw * k), h: Math.round(ch * k) };
    ICON_CROP.set(src, c);
    img.width = c.w; img.height = c.h; img.src = c.src;
  } catch (e) { img.width = 68; img.height = 56; img.classList.add("raw"); }   // no CORS: show the icon as it is

}

let WILD = new Map();   // pokedex name -> [{ id, name, section, order, grotto, rows: [{ method, min, max, rate, version, event, note }] }]
const WILD_ALIAS = { "Nidoran♀": "Nidoran-F", "Nidoran♂": "Nidoran-M", "Farfetch'd": "Farfetch’d", "Farfetch'd (Galar)": "Farfetch’d (Galar)",
  "Basculin (Blue-Striped)": "Basculin", "Basculin (Red-Striped)": "Basculin", "Heracross (Unova)": "Unovan Heracross", "Oricorio (Baile)": "Oricorio" };

      (others.length ? "Catch another Pokémon of its line and evolve it:" : "It is obtained another way (evolution, trade, gift or event).") +
      (others.length ? '<div class="wa-jumps">' + others.map((m) =>
        '<button type="button" class="lm" data-k="' + box.members.indexOf(m) + '" title="See where to find ' + esc(m.name) + '"><span class="lm-s">' + iconHTML(m) + '</span><span class="lm-n">' + esc(m.name) + "</span></button>").join("") + "</div>" : "") +
      "</div>";
  } else {
    const main = list.filter((a) => a.section !== "postgame"), post = list.filter((a) => a.section === "postgame");
    const first = (main[0] || post[0]), fr = first.rows.filter((r) => r.min != null);
    const firstLv = fr.length ? Math.min(...fr.map((r) => r.min)) : null;
    const group = (title, arr) => arr.length ? '<div class="wa-group"><h4 class="wa-gh">' + title + " · " + arr.length + '</h4><ul class="wa-list">' + arr.map(areaHTML).join("") + "</ul></div>" : "";
    body = '<div class="wa-first">' + PIN.replace("<svg", '<svg width="16" height="16" style="color:var(--volt)"') +
        "<span>First found in <b>" + esc(first.name) + "</b>" + (first.section === "postgame" ? " (postgame)" : "") + "</span>" +
        (firstLv != null ? '<span class="lvl">Lv ' + firstLv + "</span>" : "") + "</div>" +
      '<div class="wa-scroll" tabindex="0" role="region" aria-label="Where to find ' + esc(p.name) + '">' +
        group("Main story", main) + group("Postgame", post) + "</div>";
  }
  return '<section class="d-sec wa"><h3><span class="h-ico sq" aria-hidden="true">' + PIN + '</span>Where to find<span class="who">' + esc(p.name) + "</span>" +
    (list.length ? '<span class="count">' + list.length + (list.length === 1 ? " area" : " areas") + "</span>" : "") + "</h3>" + body + "</section>";
}
function duoHTML(p, box) { return '<div class="d-sec duo">' + matchupHTML(p) + whereHTML(p, box) + "</div>"; }

function cardHTML(box, i) {
  const p = box.head, [c1, c2] = colorsOf(typesOf(p));
  const more = true;   // every card opens: type matchups and where to find
  return '<li class="card' + (typesOf(p).length < 2 ? " mono" : "") + (more ? " can-open" : "") + '" data-i="' + i + '" data-k="' + box.members.indexOf(p) + '" style="--c1:' + c1 + ";--c2:" + c2 + '">' +
    '<div class="stage">' + stageInner(p, more, i) + "</div>" +
    '<div class="body">' + bodyInner(p, box) + "</div>" +
    (more ? '<div class="detail" id="detail-' + i + '">' + evoLineHTML(box, p) + duoHTML(p, box) + learnHTML(p, i, "lv") + "</div>" : "") +
  "</li>";
}

// put Pokémon k of the box in the card: sprite, types, name, abilities, stats, BST, moves, TMs, tutors
function showMember(card, box, k) {
  const p = box.members[k];
  if (!p || +card.dataset.k === k) return;
  card.dataset.k = k;
  const types = typesOf(p), [c1, c2] = colorsOf(types);
  card.style.setProperty("--c1", c1); card.style.setProperty("--c2", c2);
  card.classList.toggle("mono", types.length < 2);
  const open = card.classList.contains("open"), more = card.classList.contains("can-open");
  card.querySelector(".stage").innerHTML = stageInner(p, more, card.dataset.i);
  if (open) { const b = card.querySelector(".expander"); if (b) b.setAttribute("aria-expanded", "true"); }
  card.querySelector(".body").innerHTML = bodyInner(p, box);
  const det = card.querySelector(".detail");
  if (!det) return;
  det.querySelectorAll(".evo-node").forEach((n) => {
    const on = +n.dataset.k === k;
    n.classList.toggle("active", on);
    n.querySelector(".evo-pick").setAttribute("aria-pressed", on ? "true" : "false");
  });
  const oldDuo = det.querySelector(".duo"), tmpDuo = document.createElement("div");
  tmpDuo.innerHTML = duoHTML(p, box);
  if (oldDuo) oldDuo.replaceWith(tmpDuo.firstElementChild);
  const old = det.querySelector(".learn"), tmp = document.createElement("div");
  tmp.innerHTML = learnHTML(p, card.dataset.i, old ? old.dataset.tab : "lv");
  if (old) old.replaceWith(tmp.firstElementChild); else det.appendChild(tmp.firstElementChild);
}

function pickTab(sec, btn) {
  sec.dataset.tab = btn.dataset.t;
  sec.querySelectorAll(".learn-tab").forEach((b) => b.setAttribute("aria-selected", String(b === btn)));
}

function init(LIST) {
const BOXES = buildBoxes(LIST);
const headK = (b) => b.members.indexOf(b.head);

const grid = document.getElementById("grid");
const empty = document.getElementById("empty");
const countEl = document.getElementById("count");
const q = document.getElementById("q");
const sortEl = document.getElementById("sort");
const chipsEl = document.getElementById("chips");
const resetBtns = [document.getElementById("reset"), document.getElementById("reset2")];
const toTop = document.getElementById("toTop");
const selected = new Set();
let onlyChanged = false;
let openCard = null;

// BST range slider (one track, two handles)
const bMin = document.getElementById("bstMin"), bMax = document.getElementById("bstMax");
const BST_LO = Math.floor(Math.min(...LIST.map((p) => p.bst)) / 10) * 10, BST_HI = Math.ceil(Math.max(...LIST.map((p) => p.bst)) / 10) * 10;
[bMin, bMax].forEach((r) => { r.min = BST_LO; r.max = BST_HI; r.step = 5; });
bMin.value = BST_LO; bMax.value = BST_HI;
function bstRange() { return [+bMin.value, +bMax.value]; }
function bstActive() { return +bMin.value > BST_LO || +bMax.value < BST_HI; }
function drawBst() {
  const [lo, hi] = bstRange(), w = BST_HI - BST_LO, fill = document.getElementById("bstFill");
  fill.style.left = ((lo - BST_LO) / w * 100) + "%"; fill.style.right = ((BST_HI - hi) / w * 100) + "%";
  document.getElementById("bstMinOut").textContent = lo; document.getElementById("bstMaxOut").textContent = hi;
  document.getElementById("bstFilter").classList.toggle("on", bstActive());
  // the handle you touched last stays on top, so two handles at the same value can still be pulled apart
}
[bMin, bMax].forEach((r) => {
  r.addEventListener("input", () => {
    if (+bMin.value > +bMax.value) { if (r === bMin) bMin.value = bMax.value; else bMax.value = bMin.value; }
    bMin.style.zIndex = r === bMin ? 2 : 1; bMax.style.zIndex = r === bMax ? 2 : 1;
    drawBst(); apply();
  });
});
drawBst();


// search text of each Pokémon (name, abilities, moves, id)
const HAY = new Map(LIST.map((p) => [p, (p.name + " " + p.abilities.join(" ") + " " + (p.moves || []).map((m) => m.move).join(" ") + " " +
  (p.evo ? p.evo.method : "") + " " + (WILD.get(p.name) || []).map((a) => a.name).join(" ") + " " + p.pokedex_id + " " + String(p.pokedex_id).padStart(3, "0")).toLowerCase()]));

// type chips: a box counts for a type if any Pokémon in it has that type
const ORDER = Object.keys(TYPE_ICONS);
const typeCount = {};
BOXES.forEach((b) => new Set(b.members.flatMap(typesOf)).forEach((t) => { typeCount[t] = (typeCount[t] || 0) + 1; }));
const cb = document.createElement("button");
cb.type = "button"; cb.className = "chip chg-chip"; cb.setAttribute("aria-pressed", "false");
cb.innerHTML = '<span class="chg">PB2</span>Changed <span class="n">' + LIST.filter((p) => p.changed).length + "</span>";
cb.title = "Only boxes with Pokémon changed in Pitch Black 2";
cb.addEventListener("click", () => { onlyChanged = !onlyChanged; cb.setAttribute("aria-pressed", String(onlyChanged)); apply(); });
chipsEl.appendChild(cb);
ORDER.filter((t) => typeCount[t]).forEach((t) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.dataset.t = t; b.setAttribute("aria-pressed", "false");
  b.style.setProperty("--tc", TYPE_COLORS[t] || "#8e9ab2");
  b.innerHTML = '<img src="' + TYPE_ICONS[t] + '" alt="" width="22" height="22">' + esc(t) + ' <span class="n">' + typeCount[t] + "</span>";
  b.addEventListener("click", () => {
    if (selected.has(t)) selected.delete(t); else selected.add(t);
    b.setAttribute("aria-pressed", selected.has(t) ? "true" : "false");
    apply();
  });
  chipsEl.appendChild(b);
});

grid.innerHTML = BOXES.map(cardHTML).join("");
const cards = Array.from(grid.children);
let order = cards.slice();          // current display order (changes with "Sort by")

const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
if ("IntersectionObserver" in window && !reduce) {
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
  }, { threshold: 0.15 });
  cards.forEach((c) => io.observe(c));
} else {
  cards.forEach((c) => c.classList.add("in"));
}

function shownPokemon(i) { return BOXES[i].members[+cards[i].dataset.k] || BOXES[i].head; }
function sortCards() {
  const mode = sortEl ? sortEl.value : "dex";
  const key = {
    dex: (i) => [BOXES[i].head.pokedex_id, i],
    bst: (i) => [-shownPokemon(i).bst, BOXES[i].head.pokedex_id],
    name: (i) => [BOXES[i].head.name.toLowerCase(), 0],
  }[mode] || ((i) => [i, 0]);
  const idx = cards.map((_, i) => i).sort((a, b) => { const A = key(a), B = key(b); return A[0] < B[0] ? -1 : A[0] > B[0] ? 1 : A[1] - B[1]; });
  const wasOpen = openCard;
  if (wasOpen) wasOpen.classList.remove("open");
  order = idx.map((i) => cards[i]);
  order.forEach((c) => grid.appendChild(c));
  if (wasOpen) { wasOpen.classList.add("open"); placeOpen(wasOpen); }
}

function apply() {
  const term = q.value.trim().toLowerCase().replace(/^#/, "");
  let shown = 0;
  BOXES.forEach((b, i) => {
    const okType = !selected.size || b.members.some((m) => [...selected].every((t) => typesOf(m).includes(t)));
    const okChg = !onlyChanged || b.members.some((m) => m.changed);
    const [lo, hi] = bstRange();
    const hit = b.members.filter((m) => (!term || HAY.get(m).includes(term)) && m.bst >= lo && m.bst <= hi);
    const ok = okType && okChg && hit.length > 0;
    cards[i].hidden = !ok;
    if (!ok) return;
    shown++;
    // searching a pre-evolution by name shows it in the box ("oddish" -> Oddish in Vileplume and Bellossom)
    const byName = term && hit.find((m) => m.name.toLowerCase().startsWith(term));
    // with the BST range on, show a Pokémon of the box that is inside the range
    const pick = byName || (bstActive() && !hit.includes(b.members[headK(b)]) ? hit[hit.length - 1] : null);
    showMember(cards[i], b, pick ? b.members.indexOf(pick) : headK(b));
  });
  countEl.innerHTML = shown === BOXES.length ? "<b>" + BOXES.length + "</b> boxes · <b>" + LIST.length + "</b> Pokémon"
    : "<b>" + shown + "</b> of " + BOXES.length + " boxes";
  grid.hidden = shown === 0;
  empty.hidden = shown !== 0;
  resetBtns[0].hidden = !(selected.size || term || onlyChanged || bstActive());
  if (sortEl && sortEl.value === "bst") sortCards();
  if (openCard) { if (openCard.hidden) closeCard(openCard); else placeOpen(openCard); }
}

function clearAll() {
  q.value = ""; selected.clear(); onlyChanged = false;
  bMin.value = BST_LO; bMax.value = BST_HI; drawBst();
  chipsEl.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", "false"));
  apply(); q.focus();
}

q.addEventListener("input", apply);
if (sortEl) sortEl.addEventListener("change", () => { sortCards(); try { localStorage.setItem("pb2-dex-sort", sortEl.value); } catch (e) {} });
resetBtns.forEach((b) => b.addEventListener("click", clearAll));

document.addEventListener("keydown", (e) => {
  if (e.key !== "/" || e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  e.preventDefault(); q.focus();
});

const bar = document.querySelector(".searchbar");
window.addEventListener("scroll", () => {
  toTop.classList.toggle("show", window.scrollY > 900);
  if (bar) bar.classList.toggle("stuck", bar.getBoundingClientRect().top <= 0.5 && window.scrollY > 40);
}, { passive: true });
toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" }));

// ───────── expandable cards ─────────
// The open card takes the whole row. It moves to the start of its row so the grid never has gaps
// and every other card keeps its place in the current order.
function homeSlot(card) { const n = order[order.indexOf(card) + 1]; grid.insertBefore(card, n || null); }
function placeOpen(card) {
  homeSlot(card);
  card.classList.remove("open");
  const top = card.offsetTop;
  let first = card;
  for (let el = card.previousElementSibling; el; el = el.previousElementSibling) {
    if (el.hidden) continue;
    if (Math.abs(el.offsetTop - top) < 2) first = el; else break;
  }
  card.classList.add("open");
  if (first !== card) grid.insertBefore(card, first);
}
function closeCard(card) {
  card.classList.remove("open");
  homeSlot(card);
  const b = card.querySelector(".expander");
  if (b) b.setAttribute("aria-expanded", "false");
  if (openCard === card) openCard = null;
}
function openCardEl(card) {
  if (openCard && openCard !== card) closeCard(openCard);
  openCard = card;
  card.classList.add("in");
  placeOpen(card);
  const b = card.querySelector(".expander");
  if (b) { b.setAttribute("aria-expanded", "true"); b.focus({ preventScroll: true }); }
  requestAnimationFrame(() => card.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" }));
}
function toggleCard(card) {
  if (card.classList.contains("open")) {
    closeCard(card);
    const b = card.querySelector(".expander");
    if (b) b.focus({ preventScroll: true });
    card.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "nearest" });
  } else {
    openCardEl(card);
  }
}

grid.addEventListener("click", (e) => {
  const card = e.target.closest(".card");
  if (!card) return;
  if (e.target.closest("a")) return;
  const box = BOXES[+card.dataset.i];
  const pick = e.target.closest(".evo-pick");
  if (pick) { showMember(card, box, +pick.closest(".evo-node").dataset.k); return; }
  const lm = e.target.closest(".lm");
  if (lm) { showMember(card, box, +lm.dataset.k); if (!card.classList.contains("open") && card.classList.contains("can-open")) openCardEl(card); return; }
  if (!card.classList.contains("can-open")) return;
  const tab = e.target.closest(".learn-tab");
  if (tab) { pickTab(tab.closest(".learn"), tab); return; }
  const tmF = e.target.closest(".tm-filter");
  if (tmF) { filterTM(tmF.closest(".tab-panel"), tmF); return; }
  if (e.target.closest(".detail")) return;
  toggleCard(card);
});

// arrow keys move between the move tabs
grid.addEventListener("keydown", (e) => {
  const t = e.target.closest && e.target.closest(".learn-tab");
  if (!t || (e.key !== "ArrowRight" && e.key !== "ArrowLeft")) return;
  const all = Array.from(t.parentElement.children), i = all.indexOf(t);
  const n = all[(i + (e.key === "ArrowRight" ? 1 : all.length - 1)) % all.length];
  pickTab(t.closest(".learn"), n); n.focus(); e.preventDefault();
});

document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || !openCard) return;
  const card = openCard;
  closeCard(card);
  const b = card.querySelector(".expander");
  if (b) b.focus({ preventScroll: true });
});

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (openCard) placeOpen(openCard); }, 120);
});

q.placeholder = "Search by name, ability, move, area or #ID";
try { const s = localStorage.getItem("pb2-dex-sort"); if (s && sortEl && sortEl.querySelector('option[value="' + s + '"]')) sortEl.value = s; } catch (e) {}
apply();
if (sortEl && sortEl.value !== "dex") sortCards();
}

// ───────── load the JSON ─────────
async function fetchFirst(urls) {
  let lastErr;
  for (const url of urls) {
    try {
      const res = await fetch(url, { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status + " on " + url);
      return await res.json();
    } catch (err) { lastErr = err; }
  }
  throw lastErr || new Error("no data");
}

const statusEl = document.getElementById("count");
statusEl.textContent = "Loading Pokémon…";
(async function load() {
  const [dex, tms, mc, tut, wild] = await Promise.allSettled([fetchFirst(DATA_URLS), fetchFirst(TM_URLS), fetchFirst(MOVE_CHANGES_URLS), fetchFirst(TUTOR_URLS), fetchFirst(WILD_URLS)]);
  if (wild.status === "fulfilled") { try { buildWild(wild.value); } catch (e) { console.warn("wild_areas.json", e); } }
  if (tms.status === "fulfilled") TMDATA = tms.value;
  if (tut.status === "fulfilled") TUTDATA = tut.value;
  if (mc.status === "fulfilled" && Array.isArray(mc.value)) {
    mc.value.forEach((m) => { if (m && m.name && m.type && m.type.to) MOVE_TYPES[m.name] = m.type.to; });
  }
  if (dex.status === "fulfilled") {
    const json = dex.value;
    init(Array.isArray(json) ? json : (json.pokemon || []));
    return;
  }
  statusEl.textContent = "";
  const box = document.getElementById("loadError");
  box.hidden = false;
  box.innerHTML = "<strong>Could not load the Pokémon data.</strong> Check that assets/data/pokedex.json exists and is valid JSON." +
    "<code>" + esc(dex.reason ? dex.reason.message : "unknown error") + "</code>";
})();
</script>
</body>
</html>
