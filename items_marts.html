<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07090d">
<title>Items &amp; Marts – Pokémon Pitch Black 2</title>
<meta name="description" content="Every Poké Mart of Pokémon Pitch Black 2: special stock, TMs, evolution items, berries and prices.">
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
<!--
  HOW TO EDIT THE SHOPS
  Everything on this page comes from assets/data/shops.json in the repo.
  standardStock[] -> the base stock tiers (label, items[{name, price, icon}])
  shops[]         -> id, city, shop, image, items[{name, category, price, icon}], tms[{tm, name, type, price, icon}]
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
  :root {
    --ink: #07090d;
    --panel: #10141c;
    --panel-2: #161b26;
    --line: #232b3a;
    --line-2: #34405a;
    --text: #eaf0fb;
    --muted: #8e9ab2;
    --bolt: #2f7bff;
    --volt: #ffcb05;
    --display: "Anybody", "Arial Narrow", system-ui, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--ink); color: var(--text);
    font-family: var(--body); font-size: 16px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font-family: inherit; }
  :focus-visible { outline: 3px solid var(--volt); outline-offset: 2px; }
  .wrap { width: min(1240px, 100% - 32px); margin-inline: auto; }

  /* ───────── hero ───────── */
  .hero-zone { position: relative; isolation: isolate; overflow: hidden; }
  .hero-zone::before {
    content: ""; position: absolute; inset: 0; z-index: -2;
    background:
      radial-gradient(760px 380px at 50% 18%, rgba(47,123,255,.34), transparent 70%),
      radial-gradient(420px 260px at 88% 8%, rgba(255,203,5,.07), transparent 70%);
  }
  .hero-zone::after {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: repeating-linear-gradient(115deg, rgba(255,255,255,.04) 0 2px, transparent 2px 24px);
    -webkit-mask-image: radial-gradient(ellipse 70% 80% at 50% 25%, #000 0%, transparent 75%);
            mask-image: radial-gradient(ellipse 70% 80% at 50% 25%, #000 0%, transparent 75%);
  }
  .topbar { padding-top: 16px; }
  .home-link {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 16px 9px 12px; border-radius: 999px;
    background: rgba(16,20,28,.7); border: 1px solid var(--line-2);
    color: var(--text); text-decoration: none; font-size: 14.5px; font-weight: 600;
    backdrop-filter: blur(8px);
    transition: border-color .15s, background .15s;
  }
  .home-link:hover { border-color: var(--volt); background: rgba(22,27,38,.9); }
  .home-link svg { width: 16px; height: 16px; }

  .hero { text-align: center; padding: 6px 0 38px; }
  .hero .logo {
    display: block; margin: 0 auto 8px; width: min(380px, 80vw); height: auto;
    filter: drop-shadow(0 0 26px rgba(47,123,255,.55)) drop-shadow(0 6px 14px rgba(0,0,0,.5));
  }
  h1 {
    margin: 0; font-family: var(--display); font-weight: 800; font-stretch: 125%;
    font-size: clamp(30px, 5.6vw, 54px); line-height: 1.05; letter-spacing: .005em;
    text-shadow: 0 3px 0 rgba(0,0,0,.35), 0 0 40px rgba(47,123,255,.35);
  }

  /* ───────── toolbar ───────── */
  .searchbar {
    position: sticky; top: 0; z-index: 30; padding: 10px 0;
    background: rgba(7,9,13,.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-block: 1px solid var(--line);
  }
  .search-row { display: flex; gap: 10px; align-items: center; }
  .search { position: relative; flex: 1 1 auto; min-width: 0; }
  .search svg.glass { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search input {
    width: 100%; height: 46px; padding: 0 50px 0 44px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    font-size: 16px; font-weight: 500; -webkit-appearance: none; appearance: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .search input::-webkit-search-cancel-button { display: none; }
  .search input::placeholder { color: #67738c; }
  .search input:focus-visible { outline: none; border-color: var(--bolt); box-shadow: 0 0 0 3px rgba(47,123,255,.35); }
  .search kbd {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    min-width: 24px; padding: 2px 7px; text-align: center; border-radius: 6px;
    border: 1px solid var(--line-2); background: var(--panel-2); color: var(--muted);
    font: 600 12px var(--body); pointer-events: none;
  }
  .search input:focus ~ kbd, .search input:not(:placeholder-shown) ~ kbd { display: none; }
  @media (hover: none) { .search kbd { display: none; } }
  .reset {
    background: transparent; border: 1px solid var(--line-2); color: var(--text);
    padding: 0 14px; height: 46px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; flex: none;
    transition: border-color .15s, background .15s;
  }
  .reset:hover { border-color: var(--volt); background: var(--panel); }
  .reset[hidden] { display: none; }
  .filters { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 16px; }
  .count { color: var(--muted); font-weight: 600; font-size: 14.5px; font-variant-numeric: tabular-nums; }
  .collapse {
    height: 34px; padding: 0 14px; border-radius: 999px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); color: var(--text); font-size: 13.5px; font-weight: 600;
    transition: border-color .15s;
  }
  .collapse:hover { border-color: var(--volt); }
  .collapse[hidden] { display: none; }
  .empty { text-align: center; color: var(--muted); padding: 70px 0 30px; font-size: 17px; }
  .empty strong { display: block; color: var(--text); font-size: 20px; margin-bottom: 4px; }
  .empty .reset { margin-top: 16px; height: 42px; }
  .empty[hidden] { display: none; }
  .error { margin: 24px 0; padding: 16px 18px; border-radius: 12px; background: #2a1216; border: 1px solid #7a2a35; color: #ffd3d8; }
  .error code { display: block; margin-top: 8px; white-space: pre-wrap; font-size: 13.5px; color: #fff; }

  /* ───────── footer ───────── */
  .site-footer {
    padding: 34px 0 44px; text-align: center; border-top: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(47,123,255,.12), transparent 80%);
  }
  .credits {
    margin: 0; display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
    gap: 8px 18px; color: var(--muted); font-size: 14.5px;
  }
  .credits .game { color: var(--volt); font-family: var(--display); font-weight: 800; font-stretch: 112%; letter-spacing: .01em; font-size: 15.5px; }
  .credits strong { color: var(--text); font-weight: 700; }
  .credits .rule { width: 1px; height: 16px; background: var(--line-2); }

  .to-top {
    position: fixed; right: 18px; bottom: 18px; z-index: 40; width: 48px; height: 48px; border-radius: 50%;
    display: grid; place-items: center; border: 0; cursor: pointer;
    background: var(--volt); color: #0a0d13; box-shadow: 0 10px 28px rgba(0,0,0,.5);
    opacity: 0; visibility: hidden; transform: translateY(8px);
    transition: opacity .2s, transform .2s, visibility .2s;
  }
  .to-top.show { opacity: 1; visibility: visible; transform: none; }
  .to-top svg { width: 20px; height: 20px; }


  /* ───────── view tabs + jump chips ───────── */
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-top: 16px; }
  .seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
  .seg button {
    height: 34px; padding: 0 14px; border: 0; border-radius: 9px; cursor: pointer;
    background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; white-space: nowrap;
    transition: background .15s, color .15s;
  }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--bolt); color: #fff; }
  .seg .n { margin-left: 6px; font-size: 12px; opacity: .75; font-variant-numeric: tabular-nums; }
  .jump { display: flex; flex-wrap: wrap; gap: 6px; }
  .jump[hidden] { display: none; }
  .jump a {
    display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); color: #cdd6e8; text-decoration: none; font-size: 13px; font-weight: 600;
    transition: border-color .15s, color .15s;
  }
  .jump a:hover { border-color: var(--volt); color: #fff; }
  .jump a.dim { opacity: .35; pointer-events: none; }
  .filters { padding-top: 12px; }

  main { padding: 16px 0 48px; }
  .view[hidden] { display: none; }

  /* ───────── shop cards ───────── */
  .shops { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; grid-template-columns: 1fr; }
  .shop {
    --a: #2f7bff;
    border-radius: 18px; overflow: hidden; background: var(--panel); scroll-margin-top: 84px;
    border: 1px solid color-mix(in srgb, var(--a) 30%, var(--line));
  }
  .shop[hidden] { display: none; }
  .shop.herb { --a: #7ac74c; }
  .shop.incense { --a: #b47cff; }
  .s-head {
    position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 22px;
    padding: 18px 22px; border-bottom: 1px solid var(--line);
    background: linear-gradient(100deg, color-mix(in srgb, var(--a) 24%, var(--panel)), var(--panel) 65%);
  }
  .s-img {
    width: 160px; height: 160px; border-radius: 18px; overflow: hidden; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 70%, rgba(255,255,255,.14), transparent 70%), color-mix(in srgb, var(--a) 30%, #0a0d13);
    border: 1px solid color-mix(in srgb, var(--a) 45%, transparent);
  }
  .s-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .s-img svg { width: 70px; height: 70px; color: rgba(255,255,255,.5); }
  .s-num { font-family: var(--display); font-weight: 800; font-size: 13px; color: var(--muted); letter-spacing: .06em; }
  .s-city { margin: 2px 0 0; font-family: var(--display); font-weight: 800; font-size: clamp(26px, 3.4vw, 36px); line-height: 1.1; }
  .s-shop { margin-top: 4px; color: #cdd6e8; font-size: 16.5px; font-weight: 600; }
  .s-count {
    display: inline-flex; flex-direction: column; align-items: center; line-height: 1; padding: 7px 12px 8px; border-radius: 12px;
    background: color-mix(in srgb, var(--a) 18%, #0b0e14); border: 1px solid color-mix(in srgb, var(--a) 45%, transparent);
  }
  .s-count small { font: 600 10.5px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
  .s-count b { font-family: var(--display); font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
  .s-body { padding: 16px 22px 22px; display: grid; gap: 14px; }
  .grp h3 {
    display: flex; align-items: center; gap: 8px; margin: 0 0 6px;
    font: 700 11.5px var(--body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted);
  }
  .grp h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .grp[hidden] { display: none; }
  .rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px 10px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .it {
    --tc: #6b7a9c;
    display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 8px;
    padding: 3px 10px 3px 4px; min-height: 40px; border-radius: 10px; background: var(--panel-2); border: 1px solid transparent;
  }
  .it[hidden] { display: none; }
  .it.hit { border-color: var(--volt); background: rgba(255,203,5,.1); }
  .it img { width: 30px; height: 30px; display: block; image-rendering: pixelated; justify-self: center; }
  .it .nm { min-width: 0; font-size: 14.5px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
  .it .nm small { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; color: var(--muted); }
  .it.tm { background: color-mix(in srgb, var(--tc) 13%, var(--panel-2)); border-color: color-mix(in srgb, var(--tc) 30%, transparent); }
  .it.tm.hit { border-color: var(--volt); }
  .it.tm .nm small { color: color-mix(in srgb, var(--tc) 70%, #fff); }
  .price { font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--volt); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .price::before { content: "₽"; margin-right: 2px; font-size: 12px; opacity: .8; }

  /* ───────── standard stock ───────── */
  .std-intro { margin: 0 0 14px; color: var(--muted); font-size: 15px; }
  .tiers { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .tier-btn {
    height: 36px; padding: 0 14px; border-radius: 999px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); color: #cdd6e8; font: 600 13.5px var(--body);
  }
  .tier-btn:hover { border-color: var(--volt); color: #fff; }
  .tier-btn[aria-pressed="true"] { background: var(--volt); border-color: var(--volt); color: #0a0d13; }
  .std-card { border-radius: 18px; background: var(--panel); border: 1px solid var(--line); padding: 14px; }
  .std-card h3 { margin: 0 0 10px; font-family: var(--display); font-weight: 800; font-size: 20px; }
  .std-card h3 span { color: var(--muted); font: 600 14px var(--body); margin-left: 8px; }
  .new-tag { font: 700 10px var(--body); letter-spacing: .06em; text-transform: uppercase; color: #0a0d13; background: var(--volt); padding: 1px 6px; border-radius: 5px; margin-left: 6px; vertical-align: 2px; }

  @media (max-width: 560px) {
    .s-head { grid-template-columns: auto minmax(0, 1fr); }
    .s-count { grid-column: 1 / -1; flex-direction: row; gap: 8px; justify-self: start; padding: 4px 10px; }
    .s-count small { margin: 0; }
    .s-count b { font-size: 16px; }
    .s-img { width: 96px; height: 96px; border-radius: 14px; }
    .s-head { padding: 14px; gap: 14px; }
    .s-body { padding: 12px 12px 16px; }
    .s-city { font-size: 21px; }
    .rows { grid-template-columns: 1fr; }
    .seg { width: 100%; }
    .seg button { flex: 1; }
    .credits { flex-direction: column; gap: 6px; }
    .credits .rule { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .to-top { transition: none; } }
  .error[hidden] { display: none; }
</style>
</head>
<body>

<div class="hero-zone">
  <div class="wrap">
    <div class="topbar">
      <a class="home-link" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
        Home
      </a>
    </div>
    <header class="hero">
      <img class="logo" id="logo" src="https://raw.githubusercontent.com/lucaremix/pokemon-pitch-black-2/main/assets/images/logofull.png" alt="Pokémon Pitch Black 2" width="1774" height="887" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='assets/images/logofull.png'}">
      <h1>Items &amp; Marts</h1>
    </header>
  </div>
</div>

<div class="searchbar">
  <div class="wrap search-row">
    <div class="search">
      <svg class="glass" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search an item, a TM or a city" aria-label="Search items and shops" autocomplete="off" spellcheck="false">
      <kbd aria-hidden="true">/</kbd>
    </div>
    <button class="reset" id="reset" type="button" hidden>Clear</button>
  </div>
</div>

<section class="wrap tools" aria-label="View">
  <div class="seg" id="seg" role="group" aria-label="Stock">
    <button type="button" data-v="special" aria-pressed="true">Special stock</button>
    <button type="button" data-v="std" aria-pressed="false">Standard stock</button>
  </div>
  <nav class="jump" id="jump" aria-label="Jump to shop"></nav>
</section>

<section class="wrap filters" aria-label="Status">
  <span class="count" id="count" role="status" aria-live="polite"></span>
</section>

<main class="wrap">
  <div id="error" class="error" hidden></div>
  <div class="view" id="viewSpecial">
    <ul class="shops" id="shops"></ul>
  </div>
  <div class="view" id="viewStd" hidden>
    <p class="std-intro">Every Poké Mart sells the standard stock below. It grows with the badges you own.</p>
    <div class="tiers" id="tiers" role="group" aria-label="Stock tier"></div>
    <div class="std-card" id="stdCard"></div>
  </div>
  <div class="empty" id="empty" hidden>
    <strong>Nothing matches your search.</strong>
    Try another item, TM or city.
    <div><button class="reset" id="reset2" type="button">Clear search</button></div>
  </div>
  <noscript><p class="empty">Turn on JavaScript to see the shops.</p></noscript>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p class="credits">
      <span class="game">Pokémon Pitch Black 2</span>
      <span class="rule" aria-hidden="true"></span>
      <span>Pokémon &copy; Nintendo / Game Freak</span>
      <span class="rule" aria-hidden="true"></span>
      <span>created by <strong>lucaremix</strong> &amp; <strong>CrMagno</strong></span>
    </p>
  </div>
</footer>

<button class="to-top" id="toTop" type="button" aria-label="Back to top">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 15 7-7 7 7"/></svg>
</button>

<script>
// Data lives in assets/data/shops.json (same repo): edit that file, not this page.
const DATA_URLS = [
  "https://raw.githubusercontent.com/lucaremix/pokemon-pitch-black-2/main/assets/data/shops.json",
  "assets/data/shops.json"
];

function start(DB) {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var q = $("q"), countEl = $("count"), empty = $("empty"), resetBtns = [$("reset"), $("reset2")], toTop = $("toTop");
  var TYPE_COLORS = {
    Normal: "#a8a77a", Fire: "#ee8130", Water: "#6390f0", Electric: "#f7d02c", Grass: "#7ac74c",
    Ice: "#96d9d6", Fighting: "#c22e28", Poison: "#a33ea1", Ground: "#e2bf65", Flying: "#a98ff3",
    Psychic: "#f95587", Bug: "#a6b91a", Rock: "#b6a136", Ghost: "#735797", Dragon: "#6f35fc",
    Dark: "#705746", Steel: "#b7b7ce", Fairy: "#d685ad", Sound: "#5fb3d6"
  };
  var STORE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9 5 4h14l2 5M4 9v11h16V9M3 9h18M9 20v-6h6v6"/></svg>';
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var norm = function (s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim(); };
  var fmt = function (n) { return Number(n).toLocaleString("en-US"); };
  var SHOPS = DB.shops || [], TIERS = DB.standardStock || [];

  function itemHTML(it) {
    return '<li class="it" data-n="' + esc(norm(it.name + " " + (it.category || ""))) + '">' +
      '<img src="' + esc(it.icon || "") + '" alt="" width="30" height="30" loading="lazy" onerror="this.style.visibility=\'hidden\'">' +
      '<span class="nm">' + esc(it.name) + '</span><span class="price">' + fmt(it.price) + "</span></li>";
  }
  function tmHTML(t) {
    var c = TYPE_COLORS[t.type] || "#6b7a9c";
    return '<li class="it tm" style="--tc:' + c + '" data-n="' + esc(norm(t.tm + " " + t.name + " " + t.type + " tm")) + '">' +
      '<img src="' + esc(t.icon || "") + '" alt="' + esc(t.type) + '" title="' + esc(t.type) + '" width="30" height="30" loading="lazy" onerror="this.style.visibility=\'hidden\'">' +
      '<span class="nm"><small>' + esc(t.tm) + " · " + esc(t.type) + "</small>" + esc(t.name) + '</span><span class="price">' + fmt(t.price) + "</span></li>";
  }
  function shopHTML(s, i) {
    var groups = [], byCat = {};
    (s.items || []).forEach(function (it) {
      var c = it.category || "Items";
      if (!byCat[c]) { byCat[c] = []; groups.push(c); }
      byCat[c].push(it);
    });
    var kind = /herb/i.test(s.shop) ? " herb" : /incense/i.test(s.shop) ? " incense" : "";
    var total = (s.items || []).length + (s.tms || []).length;
    var tms = (s.tms || []).slice().sort(function (a, b) { return a.tm.localeCompare(b.tm); });
    return '<li class="shop' + kind + '" id="' + esc(s.id) + '">' +
      '<header class="s-head"><span class="s-img">' +
        (s.image ? '<img src="' + esc(s.image) + '" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{innerHTML:window.__STORE}))">' : STORE) +
      '</span><div><span class="s-num">' + String(i + 1).padStart(2, "0") + '</span><h2 class="s-city">' + esc(s.city) + '</h2><div class="s-shop">' + esc(s.shop) + "</div></div>" +
      '<span class="s-count"><small>Items</small><b>' + total + "</b></span></header>" +
      '<div class="s-body">' +
        groups.map(function (g) { return '<section class="grp"><h3>' + esc(g) + '</h3><ul class="rows">' + byCat[g].map(itemHTML).join("") + "</ul></section>"; }).join("") +
        (tms.length ? '<section class="grp"><h3>TMs</h3><ul class="rows">' + tms.map(tmHTML).join("") + "</ul></section>" : "") +
      "</div></li>";
  }
  window.__STORE = STORE;
  $("shops").innerHTML = SHOPS.map(shopHTML).join("");
  var shopEls = Array.prototype.slice.call($("shops").children);
  $("jump").innerHTML = SHOPS.map(function (s) {
    var label = s.city + (/center/i.test(s.shop) ? "" : " · " + s.shop.replace(/ shop$/i, ""));
    return '<a href="#' + esc(s.id) + '">' + esc(label) + "</a>";
  }).join("");
  var jumpEls = Array.prototype.slice.call($("jump").children);

  // ── standard stock ──
  var curTier = 0;
  function renderTier() {
    $("tiers").innerHTML = TIERS.map(function (t, i) {
      return '<button type="button" class="tier-btn" data-i="' + i + '" aria-pressed="' + (i === curTier) + '">' + esc(t.label.replace(/^Stock\s*/i, "")) + "</button>";
    }).join("");
    var t = TIERS[curTier]; if (!t) { $("stdCard").innerHTML = ""; return; }
    var prev = curTier > 0 ? TIERS[curTier - 1].items.map(function (x) { return x.name; }) : [];
    $("stdCard").innerHTML = "<h3>" + esc(t.label) + "<span>" + t.items.length + " items</span></h3>" +
      '<ul class="rows">' + t.items.map(function (it) {
        var isNew = curTier > 0 && prev.indexOf(it.name) === -1;
        return itemHTML(it).replace('<span class="nm">' + esc(it.name), '<span class="nm">' + esc(it.name) + (isNew ? '<span class="new-tag">New</span>' : ""));
      }).join("") + "</ul>";
    apply();
  }
  $("tiers").addEventListener("click", function (e) { var b = e.target.closest(".tier-btn"); if (b) { curTier = +b.dataset.i; renderTier(); } });

  // ── view tabs ──
  var view = "special";
  var segBtns = Array.prototype.slice.call(document.querySelectorAll("#seg button"));
  segBtns[0].insertAdjacentHTML("beforeend", '<span class="n">' + SHOPS.length + "</span>");
  segBtns[1].insertAdjacentHTML("beforeend", '<span class="n">' + TIERS.length + "</span>");
  $("seg").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    view = b.dataset.v;
    segBtns.forEach(function (x) { x.setAttribute("aria-pressed", x === b); });
    apply();
  });

  // ── search ──
  function apply() {
    var term = norm(q.value), shown = 0, hits = 0;
    $("viewSpecial").hidden = view !== "special"; $("viewStd").hidden = view !== "std"; $("jump").hidden = view !== "special";
    if (view === "special") {
      SHOPS.forEach(function (s, i) {
        var el = shopEls[i], shopHit = !term || norm(s.city + " " + s.shop).indexOf(term) !== -1, any = false;
        Array.prototype.forEach.call(el.querySelectorAll(".grp"), function (g) {
          var gAny = false;
          Array.prototype.forEach.call(g.querySelectorAll(".it"), function (it) {
            var m = !!term && it.dataset.n.indexOf(term) !== -1;
            it.classList.toggle("hit", m);
            it.hidden = !!term && !shopHit && !m;
            if (!it.hidden) gAny = true;
            if (m) { any = true; hits++; }
          });
          g.hidden = !gAny;
        });
        var ok = shopHit || any;
        el.hidden = !ok; jumpEls[i].classList.toggle("dim", !ok);
        if (ok) shown++;
      });
      countEl.textContent = term ? (shown + (shown === 1 ? " shop" : " shops") + (hits ? " · " + hits + " match" + (hits === 1 ? "" : "es") : "")) : SHOPS.length + " shops";
      empty.hidden = shown > 0;
    } else {
      var n = 0;
      Array.prototype.forEach.call(document.querySelectorAll("#stdCard .it"), function (it) {
        var m = !term || it.dataset.n.indexOf(term) !== -1;
        it.hidden = !m; it.classList.toggle("hit", !!term && m); if (m) n++;
      });
      countEl.textContent = term ? n + " matching items" : (TIERS[curTier] ? TIERS[curTier].items.length + " items" : "");
      empty.hidden = n > 0 || !term;
    }
    resetBtns[0].hidden = !q.value;
  }
  var t;
  q.addEventListener("input", function () { clearTimeout(t); t = setTimeout(apply, 100); });
  resetBtns.forEach(function (b) { b.addEventListener("click", function () { q.value = ""; apply(); q.focus(); }); });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "/" || e.ctrlKey || e.metaKey || e.altKey) return;
    var tag = (document.activeElement || {}).tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    e.preventDefault(); q.focus();
  });
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.addEventListener("scroll", function () { toTop.classList.toggle("show", window.scrollY > 900); }, { passive: true });
  toTop.addEventListener("click", function () { window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" }); });

  renderTier();
  if (location.hash && document.getElementById(location.hash.slice(1))) document.getElementById(location.hash.slice(1)).scrollIntoView();
}

// ───────── load the JSON ─────────
(async function load() {
  const statusEl = document.getElementById("count");
  statusEl.textContent = "Loading shops…";
  let lastErr;
  for (const url of DATA_URLS) {
    try {
      const res = await fetch(url, { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status + " on " + url);
      start(await res.json());
      return;
    } catch (err) { lastErr = err; }
  }
  statusEl.textContent = "";
  const box = document.getElementById("error");
  box.hidden = false;
  box.innerHTML = "<strong>Could not load the shops data.</strong> Check that assets/data/shops.json exists and is valid JSON." +
    "<code>" + String(lastErr ? lastErr.message : "unknown error").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])) + "</code>";
})();
</script>
</body>
